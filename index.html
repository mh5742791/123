<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="المنصة التعليمية">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title>المنصة التعليمية | الإصدار الاحترافي المتكامل</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* ════════════════════════════════════════════════════
           CSS Variables & Theming
           ════════════════════════════════════════════════════ */
        :root {
            --primary:          #2563eb;
            --primary-hover:    #1d4ed8;
            --primary-light:    #eff6ff;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);

            --secondary:        #0ea5e9;
            --secondary-hover:  #0284c7;

            --bg-color:         #f8fafc;
            --card-bg:          #ffffff;
            --text-main:        #0f172a;
            --text-muted:       #475569;
            --border:           #e2e8f0;
            --border-light:     #f1f5f9;

            --success:          #10b981;
            --success-hover:    #059669;
            --danger:           #ef4444;
            --danger-hover:     #dc2626;
            --warning:          #f59e0b;
            --warning-hover:    #d97706;

            --shadow-xs:  0 1px 2px 0 rgba(0,0,0,.05);
            --shadow-sm:  0 2px 4px 0 rgba(0,0,0,.06);
            --shadow-md:  0 6px 10px -2px rgba(0,0,0,.1);
            --shadow-lg:  0 15px 20px -5px rgba(0,0,0,.1);
            --focus-ring: 0 0 0 4px rgba(37,99,235,.15);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            --transition-fast:   0.2s ease;
            --transition-smooth: 0.3s cubic-bezier(.4,0,.2,1);

            --header-h: 70px;
        }

        /* ── Dark Mode ── */
        body.dark-mode {
            --primary:          #3b82f6;
            --primary-hover:    #60a5fa;
            --primary-light:    #1e3a8a;
            --primary-gradient: linear-gradient(135deg,#60a5fa 0%,#2563eb 100%);
            --bg-color:   #0f172a;
            --card-bg:    #1e293b;
            --text-main:  #f8fafc;
            --text-muted: #94a3b8;
            --border:     #334155;
            --border-light:#1e293b;
            --shadow-sm: 0 2px 4px 0 rgba(0,0,0,.3);
            --shadow-md: 0 6px 10px -2px rgba(0,0,0,.4);
            --shadow-lg: 0 15px 20px -5px rgba(0,0,0,.5);
            --focus-ring:0 0 0 4px rgba(59,130,246,.25);
        }

        /* ════════════════════════════════════════════════════
           Base Reset
           ════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
            transition: background-color var(--transition-smooth), color var(--transition-smooth);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-size: 16px;
        }

        .academic-text { font-family: 'Amiri', serif; font-size: 18px; line-height: 2; }

        ::-webkit-scrollbar       { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .hidden { display: none !important; }

        .container, #user-layout {
            max-width: 1440px; margin: 0 auto;
            padding: 25px; flex: 1; width: 100%;
        }

        /* ════════════════════════════════════════════════════
           Loading Overlay
           ════════════════════════════════════════════════════ */
        #loading-overlay {
            position: fixed; inset: 0;
            background: rgba(248,250,252,.95);
            backdrop-filter: blur(8px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 999999; transition: opacity .4s;
        }
        body.dark-mode #loading-overlay { background: rgba(15,23,42,.95); }
        .loader-core {
            width: 60px; height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s ease-in-out infinite;
            margin-bottom: 20px;
        }
        #loading-text { color: var(--text-main); font-weight: 800; font-size: 18px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ════════════════════════════════════════════════════
           Toast Notifications
           ════════════════════════════════════════════════════ */
        #toast-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100000; display: flex; flex-direction: column;
            gap: 12px; pointer-events: none; width: 90%; max-width: 420px;
        }
        .toast {
            padding: 14px 20px; border-radius: var(--radius-md);
            color: white; font-weight: 700;
            animation: slideUp .4s cubic-bezier(.2,.8,.2,1),
                       fadeOut .4s 4s forwards;
            box-shadow: var(--shadow-lg);
            display: flex; align-items: center; gap: 12px;
            font-size: 15px; white-space: pre-wrap;
            width: 100%;
        }
        .toast.success { background: var(--success); }
        .toast.error   { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast svg     { width: 22px; height: 22px; flex-shrink: 0; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(15px); } }

        /* ════════════════════════════════════════════════════
           Form Controls
           ════════════════════════════════════════════════════ */
        .input-group { margin-bottom: 18px; width: 100%; }
        .input-label { display: block; font-weight: 800; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            width: 100%; padding: 13px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 16px; font-family: 'Cairo', sans-serif;
            background-color: var(--card-bg); font-weight: 600;
            color: var(--text-main);
            transition: var(--transition-fast);
            -webkit-appearance: none; appearance: none;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: var(--focus-ring);
        }

        button {
            background: var(--primary); color: white; border: none;
            padding: 12px 22px; border-radius: var(--radius-md);
            cursor: pointer; font-size: 15px; font-weight: 800;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition-fast);
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; box-shadow: var(--shadow-sm);
            min-height: 48px; /* touch target */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        button:hover  { background: var(--primary-hover); box-shadow: var(--shadow-md); }
        button:active { transform: scale(0.97); box-shadow: none; }

        .btn-danger   { background: var(--danger); }  .btn-danger:hover  { background: var(--danger-hover); }
        .btn-success  { background: var(--success); } .btn-success:hover { background: var(--success-hover); }
        .btn-warning  { background: var(--warning); color:#fff; } .btn-warning:hover { background: var(--warning-hover); }
        .btn-outline  { background: transparent; border: 2px solid var(--border); color: var(--text-main); box-shadow: none; }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); border: 2px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { border-color: var(--text-muted); }
        .btn-icon-only { padding: 10px; background: transparent; color: var(--text-muted); box-shadow: none; border: 1px solid transparent; min-height: 44px; min-width: 44px; border-radius: var(--radius-sm); }
        .btn-icon-only:hover { background: var(--bg-color); color: var(--primary); border-color: var(--border); }

        svg.icon {
            width: 20px; height: 20px; stroke: currentColor;
            stroke-width: 2.2; fill: none;
            stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
        }

        /* ════════════════════════════════════════════════════
           Auth Pages
           ════════════════════════════════════════════════════ */
        .auth-section {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: var(--bg-color);
            padding: 20px;
        }
        .login-box {
            background: var(--card-bg); padding: 40px 35px;
            border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);
            width: 100%; max-width: 440px; text-align: center;
            border: 1px solid var(--border);
        }
        .login-box h2 { color: var(--text-main); font-size: 24px; margin-bottom: 28px; font-weight: 900; }
        .remember-container {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 22px; cursor: pointer;
            color: var(--text-muted); font-size: 14px; font-weight: 700;
        }
        .remember-container input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }

        /* ════════════════════════════════════════════════════
           Header
           ════════════════════════════════════════════════════ */
        header {
            background: rgba(255,255,255,.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 20px;
            height: var(--header-h);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            gap: 10px;
        }
        body.dark-mode header { background: rgba(30,41,59,.98); }
        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        header h3 { margin: 0; color: var(--primary); font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .logo-box { background: var(--primary-gradient); padding: 8px; border-radius: 10px; color: white; display: flex; box-shadow: var(--shadow-sm); flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; overflow: hidden; }
        .user-badge {
            font-weight: 800; color: var(--text-main); font-size: 13px;
            background: var(--bg-color); padding: 6px 12px;
            border-radius: 20px; border: 1px solid var(--border);
            display: flex; align-items: center; gap: 6px;
            max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ── Header text "المنصة التعليمية" hide on tiny screens ── */
        .header-title-text { display: inline; }

        /* ════════════════════════════════════════════════════
           Tabs
           ════════════════════════════════════════════════════ */
        .tabs-container { margin-top: 10px; }
        .tabs-header {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-wrap: nowrap;
            padding-right: 2px;
        }
        .tabs-header::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: transparent; color: var(--text-muted);
            padding: 10px 16px; border-radius: var(--radius-md);
            font-size: 14px; font-weight: 800; box-shadow: none; border: 1px solid transparent;
            white-space: nowrap; flex-shrink: 0; min-height: 44px;
        }
        .tab-btn:hover  { background: var(--card-bg); border-color: var(--border); color: var(--text-main); }
        .tab-btn.active { background: var(--primary-gradient); color: white; border-color: transparent; box-shadow: var(--shadow-md); }
        .tab-content { padding: 0; display: none; animation: fadeIn .3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ════════════════════════════════════════════════════
           Admin Cards & Lists
           ════════════════════════════════════════════════════ */
        .admin-card {
            background: var(--card-bg); padding: 25px;
            border-radius: var(--radius-xl); border: 1px solid var(--border);
            box-shadow: var(--shadow-md); margin-bottom: 22px;
        }
        .admin-title {
            font-size: 20px; font-weight: 900; margin: 0 0 22px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 2px solid var(--border); padding-bottom: 14px; color: var(--text-main);
        }
        .admin-list-item {
            background: var(--bg-color); border: 1px solid var(--border);
            padding: 16px 20px; border-radius: var(--radius-lg);
            margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; transition: var(--transition-fast);
            gap: 12px;
        }
        .admin-list-item:hover { border-color: var(--primary); box-shadow: var(--shadow-md); background: var(--card-bg); }
        .admin-item-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 15px; font-weight: 600; flex-wrap: wrap; }
        .admin-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .search-container { position: relative; width: 100%; max-width: 450px; margin-bottom: 18px; }
        .search-container input { padding: 13px 44px 13px 18px; margin-bottom: 0; border-radius: var(--radius-lg); }
        .search-icon-svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 18px; height: 18px; }

        .bulk-action-bar {
            background: var(--card-bg); border: 2px dashed var(--border);
            padding: 12px 18px; border-radius: var(--radius-lg); margin-bottom: 22px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            flex-wrap: wrap;
        }
        .bulk-action-bar label { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-main); }

        input[type="checkbox"] {
            width: 20px; height: 20px; cursor: pointer;
            accent-color: var(--primary); border-radius: 4px; border: 2px solid var(--border);
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center; padding: 45px 20px; color: var(--text-muted);
            background: var(--bg-color); border-radius: var(--radius-xl);
            border: 2px dashed var(--border); margin: 20px 0; font-weight: 700;
            font-size: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .empty-state svg { width: 50px; height: 50px; }

        /* ════════════════════════════════════════════════════
           Sidebar Overlay Backdrop (Mobile)
           ════════════════════════════════════════════════════ */
        #sidebar-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 499;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        #sidebar-backdrop.active { display: block; }

        /* ════════════════════════════════════════════════════
           Student Layout
           ════════════════════════════════════════════════════ */
        #user-layout { display: flex; gap: 25px; align-items: flex-start; padding: 20px; }

        .sidebar {
            width: 310px; background: var(--card-bg); padding: 20px;
            border-radius: var(--radius-xl); border: 1px solid var(--border);
            box-shadow: var(--shadow-md); flex-shrink: 0;
            height: fit-content; max-height: calc(100vh - var(--header-h) - 40px);
            overflow-y: auto; display: flex; flex-direction: column;
            position: sticky; top: calc(var(--header-h) + 10px);
            transition: all var(--transition-smooth);
        }
        .sidebar.collapsed { width: 0; padding: 0; border: none; margin: 0; opacity: 0; overflow: hidden; }
        .sidebar h3 {
            margin: 0 0 20px; color: var(--text-main); font-weight: 900; font-size: 18px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 2px solid var(--border); padding-bottom: 14px;
        }
        .sidebar-search-box { display: flex; gap: 8px; margin-bottom: 20px; position: relative; }
        .sidebar-search-box input { margin-bottom: 0; padding: 11px 11px 11px 40px; border-radius: var(--radius-md); font-size: 14px; background: var(--bg-color); }

        /* Sidebar close btn (mobile only) */
        .sidebar-close-btn {
            display: none;
            position: absolute; top: 15px; left: 15px;
            background: var(--danger); color: white;
            border: none; border-radius: 50%;
            width: 36px; height: 36px; min-height: 36px;
            padding: 0; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: var(--shadow-md);
        }

        /* ── Accordion ── */
        .premium-accordion {
            margin-bottom: 10px; border-radius: var(--radius-md);
            border: 1px solid var(--border); overflow: hidden;
            transition: var(--transition-fast); background: var(--bg-color);
        }
        .premium-accordion:hover { border-color: var(--primary); }
        .premium-accordion summary {
            padding: 14px 16px; font-weight: 800; cursor: pointer;
            color: var(--text-main); display: flex; align-items: center;
            justify-content: space-between; list-style: none;
            user-select: none; font-size: 15px; background: var(--card-bg);
            -webkit-tap-highlight-color: transparent;
        }
        .premium-accordion summary:hover { background: var(--bg-color); }
        .premium-accordion summary::-webkit-details-marker { display: none; }
        .summary-content { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
        .summary-content span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .summary-actions { display: flex; align-items: center; gap: 8px; }
        .btn-copy-folder {
            padding: 5px 8px; font-size: 11px; border-radius: var(--radius-sm);
            background: var(--bg-color); color: var(--text-muted);
            border: 1px solid var(--border); box-shadow: none;
            display: flex; align-items: center; gap: 5px;
            transition: .2s; font-family: 'Cairo', sans-serif; font-weight: 700;
            min-height: unset; white-space: nowrap;
        }
        .btn-copy-folder:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .premium-accordion summary .arrow-icon { transition: transform .3s; color: var(--text-muted); width: 16px; height: 16px; flex-shrink: 0; }
        .premium-accordion[open] summary .arrow-icon { transform: rotate(180deg); color: var(--primary); }
        .premium-accordion[open] summary { border-bottom: 2px solid var(--border); color: var(--primary); background: var(--bg-color); }
        .premium-accordion ul { list-style: none; padding: 5px 0; margin: 0; background: var(--card-bg); }

        .sidebar-item {
            padding: 13px 28px 13px 16px; cursor: pointer; color: var(--text-muted);
            font-weight: 700; transition: var(--transition-fast);
            display: flex; align-items: center; gap: 10px;
            font-size: 14px; border-right: 3px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .sidebar-item:hover { color: var(--primary); background: var(--primary-light); border-right-color: var(--primary); }
        .sidebar-item.active { background: var(--primary-light); color: var(--primary); font-weight: 800; border-right-color: var(--primary); }

        .independent-item {
            border-radius: var(--radius-md); margin-bottom: 10px;
            padding: 14px 16px; border: 1px solid var(--border);
            cursor: pointer; font-weight: 800; color: var(--text-main);
            display: flex; align-items: center; gap: 10px; font-size: 15px;
            background: var(--card-bg); box-shadow: var(--shadow-sm);
            border-right: 4px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .independent-item:hover  { border-color: var(--primary); background: var(--bg-color); border-right-color: var(--primary); }
        .independent-item.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); border-right-color: var(--primary); }

        /* ── Main Content ── */
        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .content-grid { display: flex; flex-direction: column; gap: 25px; flex: 1; }
        .content-item {
            background: var(--card-bg); padding: 28px;
            border-radius: var(--radius-xl); border: 1px solid var(--border);
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-md); flex: 1; position: relative;
        }
        .content-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border); padding-bottom: 18px;
            margin-bottom: 22px; flex-wrap: wrap; gap: 14px;
        }
        .content-title { margin: 0; color: var(--text-main); font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        /* ── iFrame Wrapper ── */
        .iframe-responsive-wrapper {
            position: relative; width: 100%; height: 75vh; min-height: 480px;
            background: var(--bg-color); border-radius: var(--radius-md);
            border: 2px solid var(--border);
            overflow: hidden;
            box-shadow: inset var(--shadow-sm);
        }
        .html-sandbox {
            border: none; background: #fff;
            width: 100%; height: 100%; display: block;
            border-radius: calc(var(--radius-md) - 2px);
        }

        /* ════════════════════════════════════════════════════
           Fullscreen Mode
           ════════════════════════════════════════════════════ */
        .iframe-responsive-wrapper.css-fullscreen {
            position: fixed !important; inset: 0 !important;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            background: #fff !important; border-radius: 0 !important; border: none !important;
            z-index: 9999999 !important; overflow: hidden !important; 
            padding-top: 56px !important;
            padding-bottom: 56px !important; /* مساحة للشريط السفلي */
        }
        .fullscreen-top-bar {
            display: none; position: absolute; top: 0; left: 0; right: 0; height: 56px;
            background: #1e293b; border-bottom: 2px solid #0f172a; z-index: 99999999;
            align-items: center; justify-content: flex-end; padding: 0 16px;
            box-shadow: 0 4px 12px rgba(0,0,0,.3);
        }
        
        /* الشريط السفلي الجديد لوضع الشاشة الكاملة */
        .fullscreen-bottom-bar {
            display: none; position: absolute; bottom: 0; left: 0; right: 0; height: 56px;
            background: #1e293b; border-top: 2px solid #0f172a; z-index: 99999999;
            box-shadow: 0 -4px 12px rgba(0,0,0,.3);
        }

        .iframe-responsive-wrapper.css-fullscreen .fullscreen-top-bar,
        .iframe-responsive-wrapper.css-fullscreen .fullscreen-bottom-bar { 
            display: flex; position: fixed; 
        }

        .fullscreen-close-btn {
            background: #ef4444; color: #fff; border: 2px solid #fff; cursor: pointer;
            padding: 8px 20px; border-radius: 50px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,.2); white-space: nowrap; min-height: unset;
        }
        .fullscreen-close-btn:hover { background: #dc2626; }
        .fullscreen-close-btn svg  { width: 20px; height: 20px; stroke-width: 2.5; flex-shrink: 0; }
        
        .iframe-responsive-wrapper.css-fullscreen .html-sandbox {
            /* خصم ارتفاع الشريط العلوي والسفلي (56 + 56 = 112) */
            height: calc(100vh - 112px) !important; 
            height: calc(100dvh - 112px) !important; 
            border-radius: 0;
        }

        /* ════════════════════════════════════════════════════
           Footer
           ════════════════════════════════════════════════════ */
        .version-footer {
            text-align: center; padding: 20px;
            color: var(--text-muted); font-size: 13px; font-weight: 700;
            width: 100%; margin-top: auto;
            border-top: 1px solid var(--border); background: var(--card-bg);
        }

        /* ════════════════════════════════════════════════════
           ★ RESPONSIVE — TABLET (768–1023px)
           ════════════════════════════════════════════════════ */
        @media (max-width: 1023px) {
            .container, #user-layout { padding: 16px; }
            #user-layout { gap: 18px; }

            .sidebar {
                width: 270px;
                max-height: calc(100vh - var(--header-h) - 30px);
                top: calc(var(--header-h) + 8px);
            }

            .admin-card { padding: 20px; }
            .content-item { padding: 22px; }

            .tabs-header { flex-wrap: nowrap; }

            header h3 { font-size: 18px; }
        }

        /* ════════════════════════════════════════════════════
           ★ RESPONSIVE — MOBILE (< 768px)
           ════════════════════════════════════════════════════ */
        @media (max-width: 767px) {

            /* ── Variables ── */
            :root { --header-h: 62px; }

            /* ── Header ── */
            header { padding: 0 14px; gap: 8px; }
            header h3 { font-size: 16px; gap: 8px; }
            .logo-box { padding: 6px; border-radius: 8px; }
            .logo-box svg { width: 18px; height: 18px; }
            .header-title-text { display: none; } /* نخبي النص ونبقي اللوجو بس */
            .user-badge { display: none !important; } /* نخبي اسم المستخدم */
            .header-left { gap: 4px; }

            /* أزرار header صغيرة */
            #install-pwa-btn span,
            #preview-btn span,
            #back-admin-btn span,
            #logout-btn span { display: none; }

            #logout-btn,
            #preview-btn,
            #back-admin-btn,
            #install-pwa-btn {
                padding: 8px !important;
                font-size: 13px !important;
                border-radius: var(--radius-sm) !important;
                min-height: 40px;
                min-width: 40px;
            }

            /* ── Container ── */
            .container { padding: 12px; }

            /* ── Tabs ── */
            .tabs-header {
                gap: 6px; margin-bottom: 16px; padding-bottom: 10px;
            }
            .tab-btn {
                padding: 8px 12px; font-size: 13px; gap: 6px; min-height: 42px;
            }
            .tab-btn svg { width: 16px; height: 16px; }
            /* نخبي النص في الـ tabs — نبقي الأيقونة فقط */
            .tab-btn .tab-label { display: none; }

            /* ── Admin Cards ── */
            .admin-card { padding: 16px; border-radius: var(--radius-lg); }
            .admin-title { font-size: 17px; margin-bottom: 16px; }
            .admin-list-item { padding: 14px 16px; flex-wrap: wrap; }
            .admin-item-actions { flex-shrink: 0; }

            /* ── Grid Columns ── */
            #tab-settings .admin-card-grid { grid-template-columns: 1fr !important; }

            /* ── Auth ── */
            .login-box { padding: 28px 20px; border-radius: var(--radius-lg); }
            .login-box h2 { font-size: 20px; margin-bottom: 22px; }

            /* ── Sidebar — Drawer Mode ── */
            #user-layout { padding: 12px; gap: 0; }

            .sidebar {
                position: fixed !important;
                top: 0 !important;
                right: -110% !important;
                width: 82vw !important;
                max-width: 330px !important;
                height: 100dvh !important;
                height: 100vh !important;
                max-height: 100vh !important;
                border-radius: 0 !important;
                z-index: 500 !important;
                padding: 60px 16px 20px !important;
                overflow-y: auto !important;
                box-shadow: -4px 0 30px rgba(0,0,0,.2) !important;
                transition: right var(--transition-smooth) !important;
            }
            .sidebar.mobile-open {
                right: 0 !important;
            }
            .sidebar.collapsed {
                right: -110% !important;
                width: 82vw !important;
                opacity: 1 !important;
                padding: 60px 16px 20px !important;
            }
            .sidebar-close-btn { display: flex !important; }

            /* ── iFrame ── */
            .iframe-responsive-wrapper {
                height: 65vh; min-height: 380px;
            }

            /* ── Content item ── */
            .content-item { padding: 16px; border-radius: var(--radius-lg); }
            .content-header { margin-bottom: 16px; padding-bottom: 14px; gap: 10px; }
            .content-title { font-size: 17px; gap: 8px; }
            .header-actions button { padding: 8px 12px !important; font-size: 13px !important; }

            /* ── User layout main ── */
            .main-content { width: 100%; }

            /* ── Accordion ── */
            .premium-accordion summary { padding: 12px 14px; font-size: 14px; }
            .sidebar-item { padding: 12px 24px 12px 14px; font-size: 14px; }
            .independent-item { padding: 13px 14px; font-size: 14px; }

            /* ── Bulk bar ── */
            .bulk-action-bar { flex-direction: row; gap: 8px; padding: 10px 14px; }
            .bulk-action-bar label { font-size: 13px; }
            .bulk-action-bar button { padding: 8px 12px; font-size: 13px; }

            /* ── search ── */
            .search-container { max-width: 100%; }

            /* ── Footer ── */
            .version-footer { font-size: 11px; padding: 14px 10px; }

            /* ── Textarea ── */
            textarea { font-size: 14px !important; }

            /* ── empty state ── */
            .empty-state { padding: 35px 15px; font-size: 14px; }
            .empty-state svg { width: 40px; height: 40px; }

            /* ── Add content grid ── */
            #tab-content-add .content-grid-2col { grid-template-columns: 1fr !important; }

            /* ── sidebar search ── */
            .sidebar h3 { font-size: 16px; margin-bottom: 14px; padding-bottom: 12px; }
            .sidebar-search-box input { font-size: 14px; }
        }

        /* ════════════════════════════════════════════════════
           ★ RESPONSIVE — SMALL MOBILE (< 380px)
           ════════════════════════════════════════════════════ */
        @media (max-width: 380px) {
            header h3 { font-size: 14px; }
            .tab-btn { padding: 7px 10px; }
            .content-item { padding: 13px; }
            .admin-card { padding: 13px; }
            .login-box { padding: 22px 16px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar overlay backdrop -->
    <div id="sidebar-backdrop"></div>

    <div id="toast-container"></div>
    <div id="loading-overlay">
        <div class="loader-core"></div>
        <h2 id="loading-text">جاري مزامنة المنصة...</h2>
    </div>

    <!-- ════════ تسجيل الدخول ════════ -->
    <div id="login-section" class="hidden auth-section">
        <div class="login-box">
            <div style="background:var(--primary-light);color:var(--primary);width:75px;height:75px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:var(--shadow-sm);transform:rotate(-5deg);">
                <svg class="icon" style="width:38px;height:38px;" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>
            </div>
            <h2>بوابة الدخول</h2>
            <div class="input-group">
                <label class="input-label">اسم المستخدم</label>
                <div style="position:relative;">
                    <input type="text" id="login-username" placeholder="معرّف الحساب" style="padding-right:42px;" autocomplete="username">
                    <svg class="icon" style="position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">الرقم السري</label>
                <div style="position:relative;">
                    <input type="password" id="login-password" placeholder="كلمة المرور" style="padding-right:42px;" onkeypress="if(event.key==='Enter') login()" autocomplete="current-password">
                    <svg class="icon" style="position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
            </div>
            <label class="remember-container"><input type="checkbox" id="remember-me"> الاحتفاظ بتسجيل الدخول</label>
            <button type="button" onclick="login()" style="width:100%;padding:15px;font-size:16px;">تسجيل الدخول <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
            <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border);">
                <button type="button" onclick="showRegisterForm()" class="btn-outline" style="width:100%;padding:12px;">تقديم طلب حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- ════════ التسجيل ════════ -->
    <div id="register-section" class="hidden auth-section">
        <div class="login-box">
            <div style="background:var(--success);color:white;width:75px;height:75px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:var(--shadow-sm);transform:rotate(5deg);">
                <svg class="icon" style="width:38px;height:38px;" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
            </div>
            <h2>إنشاء حساب</h2>
            <div class="input-group"><label class="input-label">الاسم المطلوب</label><input type="text" id="reg-username" placeholder="اسم المستخدم" autocomplete="username"></div>
            <div class="input-group"><label class="input-label">الرقم السري المقترح</label><input type="password" id="reg-password" placeholder="كلمة المرور" autocomplete="new-password"></div>
            <div class="input-group"><label class="input-label">المجموعة الدراسية</label><input type="text" id="reg-class" placeholder="مثال: الصف الثاني" onkeypress="if(event.key==='Enter') submitRegistration()"></div>
            <button type="button" onclick="submitRegistration()" class="btn-success" style="width:100%;margin-bottom:14px;padding:15px;font-size:16px;">إرسال الطلب للإدارة</button>
            <button type="button" onclick="showLoginForm()" class="btn-secondary" style="width:100%;padding:12px;">العودة للخلف</button>
        </div>
    </div>

    <!-- ════════ الهيدر ════════ -->
    <header id="main-header" class="hidden">
        <div class="header-right">
            <button type="button" id="sidebar-toggle" class="btn-icon-only hidden" onclick="toggleSidebar()" title="إظهار/إخفاء الفهرس">
                <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h3>
                <div class="logo-box"><svg class="icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg></div>
                <span class="header-title-text">المنصة التعليمية</span>
            </h3>
        </div>
        <div class="header-left">
            <button type="button" id="install-pwa-btn" class="btn-outline hidden" onclick="installPWA()" style="padding:8px 14px;font-size:14px;"><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg> <span>تثبيت</span></button>
            <span id="welcome-msg" class="user-badge" style="display:none;"></span>
            <button type="button" onclick="toggleDarkMode()" class="btn-icon-only" title="الوضع الليلي"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
            <button type="button" id="preview-btn" class="btn-warning hidden" onclick="showPreview()" style="padding:8px 14px;font-size:14px;"><svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> <span>معاينة</span></button>
            <button type="button" id="back-admin-btn" class="btn-success hidden" onclick="backToAdmin()" style="padding:8px 14px;font-size:14px;"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> <span>الإدارة</span></button>
            <button type="button" id="logout-btn" class="btn-outline" onclick="logout(true)" style="padding:8px 14px;font-size:14px;color:var(--danger);border-color:var(--danger);"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> <span>إنهاء</span></button>
        </div>
    </header>

    <!-- ════════ واجهة الإدارة ════════ -->
    <div id="admin-section" class="container hidden">
        <div class="tabs-container">
            <div class="tabs-header">
                <button type="button" class="tab-btn active" id="tab-btn-add" onclick="openTab(event,'tab-content-add')"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> <span class="tab-label">محتوى جديد</span></button>
                <button type="button" class="tab-btn" onclick="openTab(event,'tab-content-manage')"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg> <span class="tab-label">مكتبة الدروس</span></button>
                <button type="button" class="tab-btn" onclick="openTab(event,'tab-menus')"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> <span class="tab-label">المجلدات</span></button>
                <button type="button" class="tab-btn" id="tab-btn-user-add" onclick="openTab(event,'tab-users-add')"><svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg> <span class="tab-label">تسجيل طالب</span></button>
                <button type="button" class="tab-btn" onclick="openTab(event,'tab-users-manage')"><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path></svg> <span class="tab-label">إدارة الطلاب</span></button>
                <button type="button" class="tab-btn" onclick="openTab(event,'tab-pending-users'); renderPendingUsers();"><svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> <span class="tab-label">الطلبات</span></button>
                <button type="button" class="tab-btn" onclick="openTab(event,'tab-settings')"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
            </div>

            <!-- إضافة محتوى -->
            <div id="tab-content-add" class="tab-content active">
                <div class="admin-card">
                    <h2 class="admin-title" id="add-edit-title"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> إضافة ورفع مادة علمية</h2>
                    <div class="input-group">
                        <label class="input-label" style="display:flex;align-items:center;gap:6px;">
                            <svg class="icon" style="width:16px;height:16px;color:var(--primary);" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            العنوان الوصفي للدرس
                        </label>
                        <input type="text" id="content-title" placeholder="أدخل العنوان...">
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px;">
                        <div>
                            <label class="input-label" style="display:flex;align-items:center;gap:6px;">
                                <svg class="icon" style="width:16px;height:16px;color:var(--primary);" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                                نوع التنسيق
                            </label>
                            <select id="content-type"><option value="html">كود HTML (تفاعلي)</option><option value="link">رابط (URL خارجي)</option></select>
                        </div>
                        <div>
                            <label class="input-label" style="color:var(--primary);display:flex;align-items:center;gap:6px;">
                                <svg class="icon" style="width:16px;height:16px;color:var(--primary);" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                                ارتباط المجلد
                            </label>
                            <select id="content-folder"><option value="none">بدون (مستقل)</option></select>

    <script>
    'use strict';

    /* ── Debounce ── */
    function debounce(fn, ms = 300) {
        let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    }
    const processAdminContentSearch = debounce(() => filterAdminContent());
    const processAdminUserSearch    = debounce(() => filterAdminUsers());
    const processStudentSearch      = debounce(() => filterSidebar(), 150);

    /* ── HTML Escape ── */
    function escapeHTML(str) {
        return str ? String(str).replace(/[&<>'"]/g,
            t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t] || t)) : '';
    }

    /* ── State ── */
    let isGuestMode           = false;
    let currentUser           = null;
    let isPreviewMode         = false;
    let currentEditContentId  = null;
    let currentEditUserOldName= null;
    let isFirstLoad           = true;
    let deferredPrompt        = null;

    /* ── Firebase ── */
    const firebaseConfig = {
        apiKey: "AIzaSyAYfUWjixDK7MsaLNm9VudD0EIN-QeEDCw",
        authDomain: "tech-53a3b.firebaseapp.com",
        databaseURL: "https://tech-53a3b-default-rtdb.firebaseio.com",
        projectId: "tech-53a3b",
        storageBucket: "tech-53a3b.firebasestorage.app",
        messagingSenderId: "800965684824",
        appId: "1:800965684824:web:c2bea26af815f15aac642d"
    };
    try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); } catch(e) {}
    const database = firebase.database();
    let db = { users: [], contents: [], folders: [], pendingUsers: [] };

    /* ── PWA Install ── */
    window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault(); deferredPrompt = e;
        const b = document.getElementById('install-pwa-btn');
        if (b && (!currentUser || currentUser.role !== 'admin')) b.classList.remove('hidden');
    });
    function installPWA() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(c => {
            if (c.outcome === 'accepted') document.getElementById('install-pwa-btn').classList.add('hidden');
            deferredPrompt = null;
        });
    }

    /* ── Toast ── */
    function showToast(msg, type = 'success') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        const icons = {
            success: '<polyline points="20 6 9 17 4 12"></polyline>',
            error:   '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
            warning: '<line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'
        };
        t.innerHTML = `<svg class="icon" viewBox="0 0 24 24">${icons[type] || icons.success}</svg><span>${msg}</span>`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 4400);
    }

    /* ── Dark Mode ── */
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('eduDarkMode', document.body.classList.contains('dark-mode'));
    }
    if (localStorage.getItem('eduDarkMode') === 'true') document.body.classList.add('dark-mode');

    /* ── DB Helpers ── */
    function sanitizeArray(arr) { return arr ? Object.values(arr).filter(i => i != null) : []; }

    database.ref('/').on('value', snapshot => {
        try {
            const data = snapshot.val();
            if (data) {
                db.users        = sanitizeArray(data?.users);
                db.contents     = sanitizeArray(data?.contents);
                db.folders      = sanitizeArray(data?.folders);
                db.pendingUsers = sanitizeArray(data?.pendingUsers);
                db.contents.forEach(item => { if (!item?.classes) item.classes = []; if (!item?.ratio) item.ratio = '16:9'; });
            } else {
                db = { users: [{ username: '228820', password: '228820', role: 'admin' }], contents: [], folders: [], pendingUsers: [] };
                saveDB();
            }
            if (isFirstLoad) {
                document.getElementById('loading-overlay').classList.add('hidden');
                checkSession();
                isFirstLoad = false;
            } else if (currentUser && !isGuestMode) {
                const vUser = db.users.find(u => u?.username === currentUser?.username && u?.password === currentUser?.password);
                if (vUser) {
                    if (vUser?.role === 'student' && vUser?.sessionId !== localStorage.getItem('eduSessionId')) {
                        showToast('تم فصل الجلسة لفتحها من جهاز آخر', 'error');
                        setTimeout(() => logout(false), 2000); return;
                    }
                    currentUser = vUser; refreshDashboard();
                } else { logout(false); }
            }
        } catch(e) { console.error('DB sync error:', e); }
    });

    function saveDB() { database.ref('/').set(db).catch(() => showToast('حدث خلل بالاتصال', 'error')); }

    /* ── Share Links ── */
    function copyShareLink(type, value, btn) {
        const url = `${location.origin}${location.pathname}?view_${type}=${encodeURIComponent(value)}`;
        navigator.clipboard.writeText(url).then(() => {
            showToast('تم حفظ الرابط بالمحفظة', 'success');
            if (!btn) return;
            const orig = btn.innerHTML;
            btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> تم النسخ';
            btn.classList.add('btn-success'); btn.classList.remove('btn-outline','btn-icon-only','btn-secondary');
            setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('btn-success'); if (orig.includes('نسخ')) btn.classList.add('btn-outline'); else btn.classList.add('btn-icon-only'); }, 2000);
        }).catch(() => showToast('عطل فني منع النسخ', 'error'));
    }

    function copyCredentials(u, p, btn) {
        navigator.clipboard.writeText(`معرف الدخول: ${u}\nكلمة المرور: ${p}`).then(() => {
            showToast('تم نسخ هوية الوصول');
            if (!btn) return;
            const orig = btn.innerHTML;
            btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            btn.classList.add('btn-success');
            setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('btn-success'); }, 2000);
        });
    }

    /* ── Session ── */
    function checkSession() {
        let saved = null, hasLink = false;
        try {
            saved = sessionStorage.getItem('eduPlatformActiveSession') || localStorage.getItem('eduPlatformSession');
            const p = new URLSearchParams(location.search);
            hasLink = p.has('view_content') || p.has('view_folder');
        } catch(e) {}

        if (saved) {
            try {
                const sUser = JSON.parse(saved);
                const vUser = db.users.find(u => u?.username === sUser?.username && u?.password === sUser?.password);
                if (vUser) { currentUser = vUser; initDashboard(); return; }
            } catch(e) {}
        }
        if (hasLink) {
            isGuestMode = true; currentUser = { username: 'زائر', role: 'guest', isStar: false };
            initDashboard(); return;
        }
        document.getElementById('login-section').classList.remove('hidden');
        try {
            const rem = localStorage.getItem('eduRememberMe');
            if (rem) {
                const d = JSON.parse(rem);
                document.getElementById('login-username').value = d?.username || '';
                document.getElementById('login-password').value = d?.password || '';
                document.getElementById('remember-me').checked  = true;
            }
        } catch(e) {}
    }

    function login() {
        if (!db.users.length) return;
        const u = document.getElementById('login-username').value.trim();
        const p = document.getElementById('login-password').value.trim();
        if (db.pendingUsers.find(x => x?.username === u && x?.password === p))
            return showToast('حسابك قيد المراجعة الإدارية', 'warning');
        const user = db.users.find(x => x?.username === u && x?.password === p);
        if (!user) return showToast('بيانات الدخول غير صحيحة', 'error');
        const sid = Date.now().toString(36) + Math.random().toString(36).substr(2);
        user.sessionId = sid;
        try {
            localStorage.setItem('eduPlatformSession', JSON.stringify(user));
            localStorage.setItem('eduSessionId', sid);
            if (document.getElementById('remember-me').checked)
                localStorage.setItem('eduRememberMe', JSON.stringify({ username: u, password: p }));
            else localStorage.removeItem('eduRememberMe');
        } catch(e) {}
        const idx = db.users.findIndex(x => x?.username === user?.username);
        if (idx > -1) { db.users[idx].sessionId = sid; saveDB(); }
        currentUser = user; isGuestMode = false; initDashboard();
    }

    function logout(c = true) {
        try { localStorage.removeItem('eduPlatformSession'); sessionStorage.removeItem('eduPlatformActiveSession'); if (c) localStorage.removeItem('eduSessionId'); } catch(e) {}
        location.href = location.pathname;
    }

    function showRegisterForm() { document.getElementById('login-section').classList.add('hidden'); document.getElementById('register-section').classList.remove('hidden'); }
    function showLoginForm()    { document.getElementById('register-section').classList.add('hidden'); document.getElementById('login-section').classList.remove('hidden'); }

    function submitRegistration() {
        const u = escapeHTML(document.getElementById('reg-username').value.trim());
        const p = document.getElementById('reg-password').value.trim();
        const c = escapeHTML(document.getElementById('reg-class').value.trim());
        if (!u || !p || !c) return showToast('يرجى استكمال كافة الخانات', 'error');
        if (db.users.find(x => x?.username === u) || db.pendingUsers.find(x => x?.username === u))
            return showToast('المعرّف مستخدم مسبقاً', 'error');
        db.pendingUsers.push({ username: u, password: p, class: c, role: 'student', isStar: false });
        saveDB();
        ['reg-username','reg-password','reg-class'].forEach(id => document.getElementById(id).value = '');
        showToast('تم إرسال الطلب للموافقة'); showLoginForm();

    /* ── Pending Users ── */
    function renderPendingUsers() {
        const list = document.getElementById('admin-pending-list'); list.innerHTML = '';
        if (!db.pendingUsers.length)
            return list.innerHTML = '<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> سجل الطلبات فارغ</div>';
        [...db.pendingUsers].reverse().forEach(u => {

    function approveUser(u) { const i = db.pendingUsers.findIndex(x => x?.username === u); if (i > -1) { db.users.push(db.pendingUsers[i]); db.pendingUsers.splice(i, 1); saveDB(); showToast('تم تفعيل المستخدم'); renderPendingUsers(); updateClassesDropdown(); } }
    function rejectUser(u)  { if (confirm('هل أنت متأكد من قرار الرفض؟')) { db.pendingUsers = db.pendingUsers.filter(x => x?.username !== u); saveDB(); showToast('تم رفض الحساب'); renderPendingUsers(); } }

    /* ── Init Dashboard ── */
    function initDashboard() {
        ['login-section','register-section'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById('main-header').classList.remove('hidden');

        if (isGuestMode) {
            const p = new URLSearchParams(location.search);
            const vC = p.get('view_content');

            document.getElementById('welcome-msg').innerText = 'زائر';
            document.getElementById('welcome-msg').style.display = 'flex';
            document.getElementById('logout-btn').innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg> <span>دخول</span>';
            
            // تعديل: إذا كان الرابط مخصصاً لدرس واحد، نخفي الفهرس الجانبي تماماً
            if (vC) {
                document.getElementById('sidebar-toggle').classList.add('hidden');
                document.getElementById('student-sidebar').style.display = 'none';
            } else {
                document.getElementById('sidebar-toggle').classList.remove('hidden');
                document.getElementById('student-sidebar').style.display = 'flex';
            }
            
            document.querySelector('.sidebar-search-box').style.display = 'none';
            showUserDashboard(); return;
        }

        document.getElementById('welcome-msg').innerText = escapeHTML(currentUser?.username);
        document.getElementById('welcome-msg').style.display = 'flex';
        document.getElementById('logout-btn').innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> <span>خروج</span>';

        if (currentUser?.role === 'admin') {
            document.getElementById('install-pwa-btn').classList.add('hidden');
            if (localStorage.getItem('adminPreviewMode_' + currentUser?.username) === 'true') showPreview(true);
            else { document.getElementById('admin-section').classList.remove('hidden'); document.getElementById('preview-btn').classList.remove('hidden'); refreshDashboard(); }
        } else {
            document.getElementById('sidebar-toggle').classList.remove('hidden');
            document.getElementById('student-sidebar').style.display = 'flex';
            showUserDashboard();
        }
    }

    function refreshDashboard() {
        if (currentUser?.role === 'admin' && !isPreviewMode) {
            renderAdminFolders(); updateFolderDropdowns(); filterAdminContent(); filterAdminUsers(); updateClassesDropdown(); renderPendingUsers();
            openTab(null, localStorage.getItem('lastActiveAdminTab_' + currentUser?.username) || 'tab-content-add');
        } else { showUserDashboard(); }
    }

    function openTab(e, id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const el = document.getElementById(id); if (el) el.classList.add('active');
        if (e) { e.currentTarget.classList.add('active'); e.currentTarget.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' }); }
        else { const b = document.querySelector(`[onclick*="${id}"]`); if (b) b.classList.add('active'); }
        if (currentUser?.role === 'admin') localStorage.setItem('lastActiveAdminTab_' + currentUser?.username, id);
    }

    /* ── Sidebar Mobile Toggle ── */
    function toggleSidebar() {
        const sb = document.getElementById('student-sidebar');
        const bd = document.getElementById('sidebar-backdrop');
        const isMobile = window.innerWidth < 768;

        if (isMobile) {
            const isOpen = sb.classList.contains('mobile-open');
            if (isOpen) {
                sb.classList.remove('mobile-open');
                bd.classList.remove('active');
                document.body.style.overflow = '';
            } else {
                sb.classList.add('mobile-open');
                bd.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        } else {
            sb.classList.toggle('collapsed');
        }
    }

    function closeSidebarMobile() {
        const sb = document.getElementById('student-sidebar');
        const bd = document.getElementById('sidebar-backdrop');
        sb.classList.remove('mobile-open');
        bd.classList.remove('active');
        document.body.style.overflow = '';
    }

    /* Close sidebar when backdrop clicked */
    document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebarMobile);

    /* Close sidebar when item selected on mobile */
    function handleSidebarItemClick(id, el) {
        if (window.innerWidth < 768) closeSidebarMobile();
        showSingleContent(id, el);
    }

    /* ── Fullscreen ── */
    window.toggleCSSFullScreen = id => { const w = document.getElementById(id); if (w) { w.classList.add('css-fullscreen'); document.body.style.overflow = 'hidden'; } };
    window.exitCSSFullScreen   = id => { const w = document.getElementById(id); if (w) { w.classList.remove('css-fullscreen'); document.body.style.overflow = ''; } };

    /* ── Dropdowns ── */
    function updateClassesDropdown() {
        const s = document.getElementById('content-classes'); if (!s) return;
        const v = s.value;
        // التعديل: هنا نجعل "متاح للكل" هو العنصر الأول والافتراضي في القائمة المُنشأة
        s.innerHTML = `<option value="all">متاح للكل (الافتراضي)</option><option value="admin">مسودة للإدارة</option>`;
        const set = new Set();
        db.users.forEach(u => { if (u?.role === 'student' && u?.class) set.add(escapeHTML(u.class)); });
        db.contents.forEach(c => { if (c?.classes) c.classes.forEach(x => { if (x !== 'admin_only') set.add(escapeHTML(x)); }); });
        set.forEach(x => s.innerHTML += `<option value="${x}">${x}</option>`);
        if (v && [...s.options].some(o => o.value === v)) s.value = v;
    }

    function updateFolderDropdowns() {
        const s = document.getElementById('content-folder');
        s.innerHTML = '<option value="none">مستقل</option>';
        db.folders.forEach(f => s.innerHTML += `<option value="${f}">${f}</option>`);
    }

    /* ── Folders ── */
    function addFolder() {
        const f = escapeHTML(document.getElementById('new-folder-name').value.trim());
        if (!f || db.folders.includes(f)) return showToast('هذا التنظيم موجود مسبقاً!', 'error');
        db.folders.push(f); saveDB(); document.getElementById('new-folder-name').value = '';
        renderAdminFolders(); updateFolderDropdowns(); showToast('تمت إضافة المجلد بنجاح.');
    }
    function editFolder(old) {
        const n = prompt("الاسم الجديد:", old);
        if (!n || !n.trim() || n === old) return;
        const t = escapeHTML(n.trim());
        if (db.folders.includes(t)) return showToast('الاسم الجديد محجوز.', 'error');
        db.folders[db.folders.indexOf(old)] = t;
        db.contents.forEach(c => { if (c?.folder === old) c.folder = t; });
        saveDB(); renderAdminFolders(); updateFolderDropdowns(); filterAdminContent(); showToast('تم تحديث اسم المجلد.');
    }
    function deleteFolder(f) {
        if (!confirm("أنت على وشك تفريغ القائمة، متابعة؟")) return;
        db.folders = db.folders.filter(x => x !== f);
        db.contents.forEach(c => { if (c?.folder === f) c.folder = 'none'; });
        saveDB(); renderAdminFolders(); updateFolderDropdowns(); filterAdminContent(); showToast('تم الحذف وفك ارتباط الدروس.');
    }

    function renderAdminFolders() {
        const l = document.getElementById('admin-folders-list'); l.innerHTML = '';
        if (!db.folders.length)
            return l.innerHTML = '<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>لا توجد تصنيفات حالياً.</div>';
        db.folders.forEach(f => {
            l.innerHTML += `<li class="admin-list-item"><strong style="font-size:15px;display:flex;align-items:center;gap:8px;"><svg class="icon" style="color:var(--secondary);" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> ${f}</strong><div style="display:flex;gap:6px;"><button class="btn-icon-only" onclick="copyShareLink('folder','${f}',this)" title="نسخ رابط القائمة"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></button><button class="btn-icon-only" onclick="editFolder('${f}')" style="color:var(--warning);"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button><button class="btn-icon-only" onclick="deleteFolder('${f}')" style="color:var(--danger);"><svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button></div></li>`;
        });
    }

    /* ── Content CRUD ── */
    function saveContent() {
        const t  = escapeHTML(document.getElementById('content-title').value.trim());
        const ty = document.getElementById('content-type').value;
        const f  = document.getElementById('content-folder').value;
        const d  = document.getElementById('content-data').value.trim();
        const c  = document.getElementById('content-classes').value;
        const r  = document.getElementById('content-ratio').value;
        const arr = c === 'admin' ? ['admin_only'] : (c === 'all' ? [] : [c]);
        if (!t || !d) return showToast('يرجى ملء عنوان الدرس وإضافة المحتوى', 'error');
        if (currentEditContentId) {
            db.contents[db.contents.findIndex(x => x?.id === currentEditContentId)] = { id: currentEditContentId, title: t, type: ty, data: d, classes: arr, folder: f, ratio: r };
            cancelEditContent(); showToast('تم تحديث المحتوى!');
        } else {
            db.contents.push({ id: Date.now(), title: t, type: ty, data: d, classes: arr, folder: f, ratio: r });
            document.getElementById('content-title').value = '';
            document.getElementById('content-data').value = '';
            document.getElementById('content-classes').value = 'all'; // إرجاعها للافتراضي بعد الحفظ
            showToast('رائع! تم النشر');
        }
        saveDB(); filterAdminContent();
    }

    function filterAdminContent() {
        const term = document.getElementById('admin-search-content').value.toLowerCase();
        const list = document.getElementById('admin-content-list'); list.innerHTML = '';
        const res  = db.contents.filter(i => i?.title?.toLowerCase().includes(term) || (i?.folder||'').toLowerCase().includes(term));
        if (!res.length)
            return list.innerHTML = '<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>لا توجد دروس متطابقة</div>';
        [...res].reverse().forEach(i => {
            list.innerHTML += `<div class="admin-list-item"><div style="flex:1;min-width:0;"><h4 style="font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><input type="checkbox" class="content-checkbox" value="${i?.id}"><svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);width:16px;height:16px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> ${i?.title}</h4><div class="admin-item-meta" style="margin-top:5px;"><span>${i?.folder==='none'?'مستقل':i?.folder}</span></div></div><div class="admin-item-actions"><button onclick="copyShareLink('content','${i?.id}',this)" class="btn-icon-only" title="رابط المادة"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></button><button onclick="editContent(${i?.id})" class="btn-icon-only" style="color:var(--warning);" title="تعديل"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button><button onclick="deleteContent(${i?.id})" class="btn-icon-only" style="color:var(--danger);" title="إزالة"><svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button></div></div>`;
        });
    }

    function deleteContent(id) { if (confirm('هل تعي أن الإجراء يمحو الدرس بالكامل؟')) { db.contents = db.contents.filter(c => c?.id !== id); saveDB(); filterAdminContent(); showToast('تم الحذف'); } }
    function toggleAllContent(src) { document.querySelectorAll('.content-checkbox').forEach(cb => cb.checked = src?.checked); }
    function deleteSelectedContent() {
        const sel = Array.from(document.querySelectorAll('.content-checkbox:checked')).map(cb => parseInt(cb.value));
        if (!sel.length) return showToast('مجموعة فارغة. أشر أولاً.', 'warning');
        if (confirm('إزالة الجملة من النظام؟')) { db.contents = db.contents.filter(c => !sel.includes(c?.id)); saveDB(); filterAdminContent(); showToast('تم التنظيف الجماعي'); }
    }
    function editContent(id) {
        const i = db.contents.find(c => c?.id === id); if (!i) return;
        document.getElementById('content-title').value   = i.title;
        document.getElementById('content-type').value    = i.type;
        document.getElementById('content-folder').value  = i.folder || 'none';
        document.getElementById('content-data').value    = i.data;
        document.getElementById('content-classes').value = (i.classes && i.classes.includes('admin_only')) ? 'admin' : (!i.classes.length ? 'all' : i.classes[0]);
        currentEditContentId = id;
        document.getElementById('save-content-btn').innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> تطبيق التعديل';
        document.getElementById('cancel-edit-btn').classList.remove('hidden');
        openTab(null, 'tab-content-add'); window.scrollTo(0, 0);
    }
    function cancelEditContent() {
        currentEditContentId = null;
        document.getElementById('content-title').value = '';
        document.getElementById('content-data').value  = '';
        document.getElementById('content-classes').value = 'all'; // إرجاعها للافتراضي عند الإلغاء
        document.getElementById('save-content-btn').innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> حفظ المادة';
        document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    /* ── Users CRUD ── */
    function generatePassword() { document.getElementById('new-user-pass').value = Math.random().toString(36).slice(-6) + Math.floor(Math.random() * 99); }
    function saveUser() {
        const u = escapeHTML(document.getElementById('new-user-name').value.trim());
        const p = document.getElementById('new-user-pass').value.trim();
        const c = escapeHTML(document.getElementById('new-user-class').value.trim());
        const s = document.getElementById('new-user-star').checked;
        if (!u || !p) return showToast('مؤشرات الوصول ناقصة', 'error');
        if (currentEditUserOldName) {
            if (u !== currentEditUserOldName && db.users.find(x => x?.username === u)) return showToast('اسم الهوية مُحتكر مسبقاً', 'error');
            db.users[db.users.findIndex(x => x?.username === currentEditUserOldName)] = { username: u, password: p, role: 'student', class: c, isStar: s };
            cancelEditUser(); showToast('تم التعديل بنجاح');
        } else {
            if (db.users.find(x => x?.username === u)) return showToast('المشترك له قيود حالية بالشبكة', 'error');
            db.users.push({ username: u, password: p, role: 'student', class: c, isStar: s });
            ['new-user-name','new-user-pass','new-user-class'].forEach(id => document.getElementById(id).value = '');
            showToast('شمل الطالب بالمظلة التامة');
        }
        saveDB(); filterAdminUsers();
    }

        });

    function deleteUser(u) { if (confirm('هل تعي أن طرد العضو يغلق عليه كافة السبل؟')) { db.users = db.users.filter(x => x?.username !== u); saveDB(); filterAdminUsers(); showToast('فُصلت قيود المستخدم'); } }
    function toggleAllUsers(src) { document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = src?.checked); }
