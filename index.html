<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0f1723">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المنصة التعليمية">
<title>المنصة التعليمية | Fluent Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
/* ═══════════════════════════════════════════
   Microsoft Fluent Design System — CSS Core
   ═══════════════════════════════════════════ */
:root {
  /* Fluent Brand Colors */
  --fl-blue:          #0078d4;
  --fl-blue-hover:    #106ebe;
  --fl-blue-light:    #deecf9;
  --fl-blue-dark:     #004578;
  --fl-teal:          #00b294;
  --fl-green:         #107c10;
  --fl-green-light:   #dff6dd;
  --fl-red:           #d13438;
  --fl-red-light:     #fde7e9;
  --fl-amber:         #d29200;
  --fl-amber-light:   #fff4ce;
  --fl-purple:        #5c2d91;

  /* Fluent Neutrals */
  --neutral-0:   #ffffff;
  --neutral-20:  #f3f2f1;
  --neutral-30:  #edebe9;
  --neutral-40:  #e1dfdd;
  --neutral-60:  #c8c6c4;
  --neutral-80:  #a19f9d;
  --neutral-100: #8a8886;
  --neutral-120: #605e5c;
  --neutral-150: #323130;
  --neutral-160: #201f1e;
  --neutral-180: #11100f;

  /* Semantic */
  --primary:          var(--fl-blue);
  --primary-hover:    var(--fl-blue-hover);
  --primary-light:    var(--fl-blue-light);
  --primary-gradient: linear-gradient(135deg,#0078d4 0%,#106ebe 50%,#004578 100%);

  --success:   var(--fl-green);
  --success-bg:var(--fl-green-light);
  --danger:    var(--fl-red);
  --danger-bg: var(--fl-red-light);
  --warning:   var(--fl-amber);
  --warning-bg:var(--fl-amber-light);

  /* Surface */
  --bg:        #f3f2f1;
  --surface:   #ffffff;
  --surface-2: #faf9f8;
  --surface-3: #f3f2f1;
  --overlay:   rgba(255,255,255,.85);

  /* Text */
  --text:      #201f1e;
  --text-sec:  #605e5c;
  --text-muted:#8a8886;
  --text-inv:  #ffffff;

  /* Border */
  --border:    #e1dfdd;
  --border-2:  #c8c6c4;

  /* Shadow — Fluent depth levels */
  --shadow-2:  0 2px 4px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --shadow-4:  0 4px 8px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --shadow-8:  0 8px 16px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --shadow-16: 0 16px 32px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --shadow-64: 0 64px 64px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --focus-ring:0 0 0 3px rgba(0,120,212,.4);

  /* Shape */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl:20px;
  --r-full:9999px;

  /* Motion */
  --ease-fl: cubic-bezier(.1,.9,.2,1);
  --dur-fast:.15s;
  --dur-norm:.25s;
  --dur-slow:.35s;

  /* Layout */
  --header-h:56px;
  --sidebar-w:280px;
  --content-max:1440px;
}

/* ── Dark Mode ── */
body.dark {
  --bg:        #11100f;
  --surface:   #1b1a19;
  --surface-2: #201f1e;
  --surface-3: #323130;
  --overlay:   rgba(27,26,25,.9);
  --text:      #f3f2f1;
  --text-sec:  #c8c6c4;
  --text-muted:#8a8886;
  --border:    #3b3a39;
  --border-2:  #484644;
  --primary-light:#004578;
  --fl-blue-light:#004578;
  --fl-green-light:#063206;
  --fl-red-light:#3b0509;
  --fl-amber-light:#2d1e00;
  --shadow-2:0 2px 4px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.3);
  --shadow-4:0 4px 8px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.3);
  --shadow-8:0 8px 16px rgba(0,0,0,.4),0 0 2px rgba(0,0,0,.3);
  --shadow-16:0 16px 32px rgba(0,0,0,.5),0 0 2px rgba(0,0,0,.3);
}

/* ═══ Reset ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Cairo',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.6;overflow-x:hidden;
  transition:background var(--dur-slow),color var(--dur-slow);
  display:flex;flex-direction:column;min-height:100vh;font-size:15px;
}
.amiri{font-family:'Amiri',serif;font-size:17px;line-height:2;}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--neutral-60);border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--fl-blue)}
.hidden{display:none!important}
img,svg{display:block}

/* ═══ Fluent Acrylic Overlay ═══ */
.acrylic{
  background:var(--overlay);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
}

/* ═══ Loading ═══ */
#loading-overlay{
  position:fixed;inset:0;z-index:999999;
  background:var(--bg);display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:20px;
  transition:opacity .4s;
}
.fl-spinner{
  width:48px;height:48px;position:relative;
}
.fl-spinner::before,.fl-spinner::after{
  content:'';position:absolute;inset:0;
  border:3px solid transparent;border-radius:50%;
}
.fl-spinner::before{
  border-top-color:var(--fl-blue);
  animation:fl-spin .8s var(--ease-fl) infinite;
}
.fl-spinner::after{
  border-bottom-color:var(--fl-blue);opacity:.4;
  animation:fl-spin 1.2s var(--ease-fl) infinite reverse;
}
@keyframes fl-spin{to{transform:rotate(360deg)}}
#loading-text{font-weight:700;font-size:15px;color:var(--text-sec);}

/* ═══ Toast ═══ */
#toast-container{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:100000;display:flex;flex-direction:column;gap:10px;
  pointer-events:none;width:90%;max-width:400px;
}
.toast{
  padding:12px 18px;border-radius:var(--r-md);color:#fff;font-weight:700;
  display:flex;align-items:center;gap:10px;font-size:14px;
  animation:toast-in .3s var(--ease-fl),toast-out .3s 4s forwards;
  box-shadow:var(--shadow-8);border:1px solid rgba(255,255,255,.15);
}
.toast.success{background:#107c10}
.toast.error  {background:#d13438}
.toast.warning{background:#d29200}
.toast svg{width:18px;height:18px;flex-shrink:0}
@keyframes toast-in {from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{from{opacity:1}to{opacity:0;transform:translateY(8px)}}

/* ═══ Inputs / Controls ═══ */
.input-group{margin-bottom:16px;width:100%}
.input-label{
  display:flex;align-items:center;gap:6px;
  font-weight:700;font-size:13px;color:var(--text-sec);
  margin-bottom:6px;
}
input[type="text"],input[type="password"],select,textarea{
  width:100%;padding:8px 12px;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  font-size:14px;font-family:'Cairo',sans-serif;font-weight:500;
  background:var(--surface);color:var(--text);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast);
  -webkit-appearance:none;appearance:none;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--fl-blue);box-shadow:var(--focus-ring);
}
input::placeholder{color:var(--text-muted);font-weight:400}

/* ── Button System ── */
button{
  font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;
  border:none;border-radius:var(--r-sm);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:background var(--dur-fast),box-shadow var(--dur-fast),transform var(--dur-fast);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding:8px 16px;min-height:32px;background:var(--surface-3);color:var(--text);
}
button:hover{background:var(--neutral-40)}
button:active{transform:scale(.97)}

.btn-primary{background:var(--fl-blue);color:#fff}
.btn-primary:hover{background:var(--fl-blue-hover)}
.btn-success{background:var(--fl-green);color:#fff}
.btn-success:hover{background:#0a6009}
.btn-danger{background:var(--fl-red);color:#fff}
.btn-danger:hover{background:#b52e32}
.btn-warning{background:var(--fl-amber);color:#fff}
.btn-warning:hover{background:#b07a00}
.btn-ghost{background:transparent;color:var(--fl-blue);border:1.5px solid var(--fl-blue)}
.btn-ghost:hover{background:var(--fl-blue-light)}
.btn-subtle{background:transparent;color:var(--text-sec);border:1.5px solid var(--border)}
.btn-subtle:hover{border-color:var(--border-2);background:var(--surface-3)}
.btn-icon{
  padding:6px;background:transparent;color:var(--text-muted);
  border:none;border-radius:var(--r-sm);min-height:32px;min-width:32px;
}
.btn-icon:hover{background:var(--surface-3);color:var(--fl-blue)}
.btn-icon.danger:hover{background:var(--fl-red-light);color:var(--fl-red)}
.btn-icon.warning:hover{background:var(--fl-amber-light);color:var(--fl-amber)}
.btn-icon.success:hover{background:var(--fl-green-light);color:var(--fl-green)}

/* ── Fluent Checkbox ── */
input[type="checkbox"]{
  width:18px;height:18px;cursor:pointer;
  accent-color:var(--fl-blue);flex-shrink:0;
  border-radius:var(--r-xs);
}

/* ═══ Header ═══ */
header{
  height:var(--header-h);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:sticky;top:0;z-index:1000;
  box-shadow:var(--shadow-2);gap:8px;
}
body.dark header{background:var(--surface)}

.header-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{
  width:32px;height:32px;border-radius:var(--r-sm);
  background:var(--primary-gradient);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-4);flex-shrink:0;
}
.brand-icon svg{width:18px;height:18px;color:#fff;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-weight:800;font-size:16px;color:var(--fl-blue);white-space:nowrap}
.header-title-text{display:inline}

.header-actions{display:flex;align-items:center;gap:4px}
.user-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--surface-3);border:1px solid var(--border);
  padding:4px 10px;border-radius:var(--r-full);
  font-size:13px;font-weight:700;color:var(--text-sec);
  max-width:130px;overflow:hidden;
}
.user-pill svg{width:15px;height:15px;flex-shrink:0;color:var(--fl-blue)}
.user-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══ Auth ═══ */
.auth-wrap{
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;background:var(--bg);padding:20px;
  background-image:
    radial-gradient(ellipse 60% 50% at 20% 20%,rgba(0,120,212,.06) 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 80%,rgba(0,178,148,.05) 0%,transparent 70%);
}
.auth-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);box-shadow:var(--shadow-16);
  padding:36px 32px;width:100%;max-width:420px;
  animation:auth-pop .4s var(--ease-fl) both;
}
@keyframes auth-pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.auth-icon{
  width:64px;height:64px;border-radius:var(--r-xl);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;box-shadow:var(--shadow-4);
}
.auth-icon svg{width:32px;height:32px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.auth-box h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:24px;color:var(--text)}
.auth-divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--text-muted);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;cursor:pointer;color:var(--text-sec);font-size:13px;font-weight:600}

/* ═══ Main Containers ═══ */
.page-wrap{max-width:var(--content-max);margin:0 auto;padding:20px;flex:1;width:100%}
#user-layout{display:flex;gap:20px;align-items:flex-start;padding:16px;flex:1;max-width:var(--content-max);margin:0 auto;width:100%}

/* ═══ Sidebar ═══ */
#sidebar-backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);z-index:499;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
#sidebar-backdrop.active{display:block}

.sidebar{
  width:var(--sidebar-w);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-4);flex-shrink:0;
  height:calc(100vh - var(--header-h) - 32px);
  overflow-y:auto;display:flex;flex-direction:column;
  position:sticky;top:calc(var(--header-h) + 16px);
  transition:all var(--dur-slow) var(--ease-fl);
}
.sidebar.collapsed{width:0;opacity:0;overflow:hidden;border:none;margin:0;padding:0}

.sidebar-header{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.sidebar-header h3{font-size:14px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px;flex:1}
.sidebar-header h3 svg{width:16px;height:16px;color:var(--fl-blue)}

.sidebar-search{padding:10px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.sidebar-search input{padding:7px 32px 7px 10px;border-radius:var(--r-full);background:var(--surface-3);font-size:13px}
.sidebar-search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.sidebar-search-icon svg{width:15px;height:15px}

.sidebar-body{flex:1;overflow-y:auto;padding:8px}

/* Sidebar close (mobile) */
.sidebar-close{
  display:none;position:absolute;top:12px;right:12px;
  background:var(--surface-3);border:1px solid var(--border);
  border-radius:50%;width:28px;height:28px;min-height:28px;min-width:28px;
  padding:0;color:var(--text-muted);
}
.sidebar-close:hover{background:var(--fl-red-light);color:var(--fl-red);border-color:var(--fl-red)}

/* ── Accordion ── */
.acc{
  border-radius:var(--r-md);border:1px solid var(--border);
  overflow:hidden;margin-bottom:6px;background:var(--surface);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast);
}
.acc:hover{border-color:var(--fl-blue);box-shadow:var(--shadow-2)}
.acc summary{
  padding:10px 12px;font-weight:700;cursor:pointer;
  color:var(--text);display:flex;align-items:center;gap:8px;
  list-style:none;user-select:none;font-size:13px;
  background:var(--surface-2);
  -webkit-tap-highlight-color:transparent;
}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--surface-3)}
.acc[open] summary{background:var(--fl-blue-light);color:var(--fl-blue);border-bottom:1px solid var(--border)}
body.dark .acc[open] summary{background:var(--primary-light)}
.acc-folder-icon{width:15px;height:15px;color:var(--fl-blue);flex-shrink:0}
.acc-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-chevron{
  width:14px;height:14px;color:var(--text-muted);flex-shrink:0;
  transition:transform var(--dur-norm) var(--ease-fl);
}
.acc[open] .acc-chevron{transform:rotate(180deg);color:var(--fl-blue)}
.acc-copy-btn{
  padding:3px 7px;font-size:11px;font-weight:700;
  background:transparent;border:1px solid var(--border);
  border-radius:var(--r-full);color:var(--text-muted);font-family:'Cairo',sans-serif;
  min-height:unset;white-space:nowrap;gap:4px;
}
.acc-copy-btn:hover{background:var(--fl-blue);color:#fff;border-color:var(--fl-blue)}
.acc-copy-btn svg{width:11px;height:11px}

.acc ul{list-style:none;padding:4px 0;background:var(--surface)}
.acc-item{
  padding:9px 12px 9px 20px;cursor:pointer;color:var(--text-sec);
  font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;
  border-right:3px solid transparent;
  transition:background var(--dur-fast),color var(--dur-fast),border-color var(--dur-fast);
  -webkit-tap-highlight-color:transparent;
}
.acc-item:hover{background:var(--fl-blue-light);color:var(--fl-blue);border-right-color:var(--fl-blue)}
.acc-item.active{background:var(--fl-blue-light);color:var(--fl-blue);border-right-color:var(--fl-blue);font-weight:800}
.acc-item svg{width:13px;height:13px;opacity:.6;flex-shrink:0}

.ind-item{
  border-radius:var(--r-md);border:1px solid var(--border);
  padding:10px 12px;cursor:pointer;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:9px;font-size:13px;
  margin-bottom:6px;background:var(--surface);
  border-right:3px solid transparent;
  transition:all var(--dur-fast);
  -webkit-tap-highlight-color:transparent;
}
.ind-item:hover{border-color:var(--fl-blue);border-right-color:var(--fl-blue);background:var(--fl-blue-light);color:var(--fl-blue)}
.ind-item.active{border-color:var(--fl-blue);border-right-color:var(--fl-blue);background:var(--fl-blue-light);color:var(--fl-blue)}
.ind-item svg{width:15px;height:15px;color:var(--fl-blue);flex-shrink:0}

/* ═══ Main Content ═══ */
.main-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}

.content-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-2);
  overflow:hidden;animation:card-in .3s var(--ease-fl) both;
}
@keyframes card-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.content-card-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;background:var(--surface);
}
.content-card-title{
  font-size:16px;font-weight:800;color:var(--text);
  display:flex;align-items:center;gap:9px;
}
.content-card-title svg{width:18px;height:18px;color:var(--fl-blue)}
.content-card-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.content-card-body{padding:16px}

/* ── iFrame wrapper ── */
.iframe-wrap{
  width:100%;height:72vh;min-height:450px;
  border-radius:var(--r-md);border:1px solid var(--border);
  overflow:hidden;background:var(--surface-3);
  position:relative;
}
.html-sandbox{border:none;width:100%;height:100%;display:block;background:#fff}

/* ── Fullscreen ── */
.iframe-wrap.fs{
  position:fixed!important;inset:0!important;
  width:100vw!important;height:100vh!important;height:100dvh!important;
  border-radius:0!important;border:none!important;
  z-index:99999999!important;padding-top:50px!important;padding-bottom:50px!important;
  transition:padding var(--dur-norm);
}
.iframe-wrap.fs.bars-off{padding:0!important}
.iframe-wrap.fs.bars-off .fs-top,.iframe-wrap.fs.bars-off .fs-bot{transform:translateY(-100%) translateY(-100%)}
.iframe-wrap.fs .html-sandbox{height:calc(100vh - 100px)!important;height:calc(100dvh - 100px)!important}
.iframe-wrap.fs.bars-off .html-sandbox{height:100vh!important;height:100dvh!important}

.fs-bar{
  display:none;position:fixed;left:0;right:0;height:50px;z-index:999999999;
  background:#0f1723;border-bottom:1px solid #1e3a5f;
  align-items:center;padding:0 16px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform var(--dur-norm);
}
.fs-top{top:0;border-bottom:1px solid #1e3a5f}
.fs-bot{bottom:0;border-top:1px solid #1e3a5f;border-bottom:none}
.iframe-wrap.fs .fs-bar{display:flex}
.fs-close-btn{
  background:#d13438;color:#fff;border:none;
  padding:6px 16px;border-radius:var(--r-full);font-family:'Cairo',sans-serif;
  font-weight:700;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;min-height:unset;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.fs-close-btn:hover{background:#b52e32}
.fs-close-btn svg{width:16px;height:16px;stroke-width:2.5}
.fs-title{color:#c8c6c4;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 12px}

.fs-toggle-btn{
  display:none;position:fixed;top:58px;left:50%;transform:translateX(-50%);
  z-index:9999999999;width:38px;height:38px;border-radius:50%;
  background:rgba(0,120,212,.8);color:#fff;border:2px solid rgba(255,255,255,.3);
  cursor:pointer;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5);padding:0;min-height:unset;
  transition:all var(--dur-norm);
}
.fs-toggle-btn:hover{background:var(--fl-blue);border-color:rgba(255,255,255,.6);transform:translateX(-50%) scale(1.05)}
.iframe-wrap.fs .fs-toggle-btn{display:flex}
.iframe-wrap.fs.bars-off .fs-toggle-btn{top:12px;background:rgba(0,120,212,.9)}
.fs-toggle-btn svg{width:18px;height:18px}

/* ═══ Admin Layout ═══ */
.tabs-container{margin-top:0}
.tabs-bar{
  display:flex;gap:2px;border-bottom:2px solid var(--border);
  margin-bottom:18px;overflow-x:auto;padding-bottom:0;
  scrollbar-width:none;-ms-overflow-style:none;
}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{
  background:transparent;color:var(--text-muted);
  padding:10px 14px;border-radius:var(--r-sm) var(--r-sm) 0 0;
  font-size:13px;font-weight:700;white-space:nowrap;
  border:none;border-bottom:2px solid transparent;min-height:40px;
  margin-bottom:-2px;gap:6px;transition:all var(--dur-fast);
}
.tab-btn:hover{background:var(--surface-3);color:var(--text)}
.tab-btn.active{color:var(--fl-blue);border-bottom-color:var(--fl-blue);background:var(--surface-2)}
.tab-pane{display:none;animation:fade-in .25s var(--ease-fl)}
.tab-pane.active{display:block}
@keyframes fade-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── Admin Cards ── */
.adm-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-2);
  padding:20px;margin-bottom:16px;
}
.adm-card-title{
  font-size:17px;font-weight:800;margin:0 0 16px;
  display:flex;align-items:center;gap:9px;color:var(--text);
  padding-bottom:12px;border-bottom:1px solid var(--border);
}
.adm-card-title svg{width:18px;height:18px;color:var(--fl-blue)}

.adm-row{
  background:var(--surface-2);border:1px solid var(--border);
  padding:12px 14px;border-radius:var(--r-md);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  transition:all var(--dur-fast);
}
.adm-row:hover{border-color:var(--fl-blue);box-shadow:var(--shadow-4);background:var(--surface)}
.adm-row-info{flex:1;min-width:0}
.adm-row-title{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;color:var(--text);flex-wrap:wrap}
.adm-row-title svg{width:14px;height:14px;color:var(--fl-blue);flex-shrink:0}
.adm-row-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:10px;font-weight:600;flex-wrap:wrap}
.adm-row-actions{display:flex;gap:4px;flex-shrink:0}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:700;
}
.badge-blue{background:var(--fl-blue-light);color:var(--fl-blue)}
.badge-green{background:var(--fl-green-light);color:var(--fl-green)}
.badge-red{background:var(--fl-red-light);color:var(--fl-red)}
.badge-amber{background:var(--fl-amber-light);color:var(--fl-amber)}

/* ── Toolbar / Bulk bar ── */
.toolbar{
  display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;
}
.toolbar .search-box{
  position:relative;flex:1;min-width:200px;
}
.toolbar .search-box input{padding-right:36px;border-radius:var(--r-full);background:var(--surface)}
.toolbar .search-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.toolbar .search-icon svg{width:15px;height:15px}
.bulk-bar{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:var(--r-md);
  background:var(--surface-3);border:1px dashed var(--border);flex-shrink:0;
}
.bulk-bar label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-sec)}

/* ── Empty State ── */
.empty{
  text-align:center;padding:40px 20px;color:var(--text-muted);
  background:var(--surface-3);border-radius:var(--r-lg);
  border:2px dashed var(--border);margin:10px 0;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  font-weight:700;font-size:14px;
}
.empty svg{width:44px;height:44px;opacity:.4}

/* ═══ Link Content ═══ */
.link-content-btn{
  display:flex;align-items:center;justify-content:center;gap:14px;
  background:var(--primary-gradient);color:#fff;padding:20px;
  text-decoration:none;border-radius:var(--r-lg);margin-top:12px;
  font-weight:800;font-size:16px;box-shadow:var(--shadow-8);
  transition:all .2s;
}
.link-content-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-16)}
.link-content-btn svg{width:22px;height:22px;flex-shrink:0}

/* ═══ Footer ═══ */
.app-footer{
  text-align:center;padding:14px;color:var(--text-muted);
  font-size:11px;font-weight:600;
  border-top:1px solid var(--border);background:var(--surface);
  margin-top:auto;
}

/* ══════════════════
   Responsive
   ══════════════════ */
@media(max-width:1023px){
  .page-wrap,#user-layout{padding:12px}
  .sidebar{width:260px}
}
@media(max-width:767px){
  :root{--header-h:52px;--sidebar-w:85vw}
  .header-title-text{display:none}
  .user-pill{display:none!important}
  #sidebar-toggle,.btn-sidebar-tog{display:flex!important}
  #user-layout{padding:10px;gap:0}
  .sidebar{
    position:fixed!important;top:0!important;right:-110%!important;
    width:var(--sidebar-w)!important;max-width:320px!important;
    height:100dvh!important;height:100vh!important;max-height:100vh!important;
    border-radius:0!important;z-index:500!important;
    padding-top:50px!important;overflow-y:auto!important;
    box-shadow:var(--shadow-16)!important;
    transition:right var(--dur-slow) var(--ease-fl)!important;
    top:0!important;
  }
  .sidebar.mobile-open{right:0!important}
  .sidebar.collapsed{right:-110%!important;width:var(--sidebar-w)!important;opacity:1!important}
  .sidebar-close{display:flex!important}
  .iframe-wrap{height:60vh;min-height:360px}
  .content-card-body{padding:12px}
  .content-card-header{padding:12px 14px}
  .adm-card{padding:14px}
  .tab-btn .tab-lbl{display:none}
  .tab-btn{padding:9px 11px}
  .adm-row{flex-wrap:wrap}

  /* header btn text hidden */
  #btn-preview span,#btn-back-admin span,#btn-logout span,#btn-install span{display:none}
  #btn-preview,#btn-back-admin,#btn-logout,#btn-install{padding:7px!important;min-width:36px;min-height:36px}
}
@media(max-width:380px){
  .tab-btn{padding:8px 8px}
  .adm-card{padding:11px}
}
</style>
</head>
<body>

<div id="sidebar-backdrop"></div>
<div id="toast-container"></div>

<!-- Loading Overlay -->
<div id="loading-overlay">
  <div class="fl-spinner"></div>
  <div id="loading-text">جاري مزامنة المنصة...</div>
</div>

<!-- ═══ AUTH: Login ═══ -->
<div id="pg-login" class="hidden auth-wrap">

    </div>
    <h2>بوابة الدخول</h2>
    <div class="input-group">
      <label class="input-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        اسم المستخدم
      </label>
      <div style="position:relative">
        <input type="text" id="login-user" placeholder="معرّف الحساب" autocomplete="username" style="padding-right:38px">

      </div>
    </div>
    <div class="input-group">
      <label class="input-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

      </label>

      </div>
    </div>
    <label class="remember-row">
      <input type="checkbox" id="remember-me">
      <span>الاحتفاظ بتسجيل الدخول</span>
    </label>
    <button class="btn-primary" onclick="login()" style="width:100%;padding:10px;font-size:15px;border-radius:var(--r-md)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      تسجيل الدخول

    <div class="auth-divider">أو</div>
    <button class="btn-subtle" onclick="showReg()" style="width:100%;padding:9px;border-radius:var(--r-md)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      تقديم طلب حساب جديد
    </button>
  </div>
</div>

<!-- ═══ AUTH: Register ═══ -->
<div id="pg-register" class="hidden auth-wrap">
  <div class="auth-box">
    <div class="auth-icon" style="background:linear-gradient(135deg,#107c10,#0a6009)">
      <svg viewBox="0 0 24 24" stroke="white" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
    </div>
    <h2>إنشاء حساب</h2>
    <div class="input-group">
      <label class="input-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        الاسم المطلوب
      </label>
      <input type="text" id="reg-user" placeholder="اسم المستخدم" autocomplete="username">

    <div class="input-group">
      <label class="input-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

      <label class="input-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        المجموعة الدراسية

      <input type="text" id="reg-class" placeholder="مثال: الصف الثاني" onkeypress="if(event.key==='Enter')submitReg()">

</header>

/* ── Toast ── */
function toast(msg,type='success'){
  const c=$('toast-container'),t=document.createElement('div');
  t.className=`toast ${type}`;
  const icons={
    success:'<polyline points="20 6 9 17 4 12"/>',
    error:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    warning:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
  };
  t.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${icons[type]||icons.success}</svg><span>${msg}</span>`;
  c.appendChild(t);setTimeout(()=>t.remove(),4400);
}

/* ── DB helpers ── */
function sanitize(arr){return arr?Object.values(arr).filter(i=>i!=null):[]}

db.ref('/').on('value',snap=>{
  try{
    const data=snap.val();
    if(data){
      DB.users=sanitize(data?.users);
      DB.contents=sanitize(data?.contents);
      DB.folders=sanitize(data?.folders);
      DB.pendingUsers=sanitize(data?.pendingUsers);
      DB.contents.forEach(i=>{if(!i?.classes)i.classes=[];if(!i?.ratio)i.ratio='16:9'});
    }else{
      DB={users:[{username:'228820',password:'228820',role:'admin'}],contents:[],folders:[],pendingUsers:[]};
      saveToDB();
    }
    if(isFirstLoad){
      $('loading-overlay').classList.add('hidden');
      checkSession();isFirstLoad=false;
    }else if(currentUser&&!guestMode){
      const v=DB.users.find(u=>u?.username===currentUser?.username&&u?.password===currentUser?.password);
      if(v){
        if(v.role==='student'&&v.sessionId&&v.sessionId!==localStorage.getItem('edu-sid')){
          toast('تم فصل الجلسة — فُتحت من جهاز آخر','error');
          setTimeout(()=>logout(false),2000);return;
        }
        currentUser=v;refreshDash();
      }else logout(false);
    }
  }catch(e){console.error('DB sync',e)}
});

function saveToDB(){db.ref('/').set(DB).catch(()=>toast('خطأ في الاتصال','error'))}

/* ── Share Links ── */
function copyLink(type,val,btn){
  const url=`${location.origin}${location.pathname}?view_${type}=${encodeURIComponent(val)}`;
  navigator.clipboard.writeText(url).then(()=>{
    toast('تم نسخ الرابط');
    if(!btn)return;
    const orig=btn.innerHTML;
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> تم';
    btn.classList.add('btn-success');
    setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('btn-success')},2000);
  }).catch(()=>toast('فشل النسخ','error'));
}
function copyCreds(u,p,btn){
  navigator.clipboard.writeText(`اسم الدخول: ${u}\nكلمة المرور: ${p}`).then(()=>{
    toast('تم نسخ بيانات الدخول');
    if(!btn)return;
    const orig=btn.innerHTML;
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    btn.classList.add('btn-success');
    setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('btn-success')},2000);
  });
}

/* ── Session ── */
function checkSession(){
  let saved=null,hasLink=false;
  try{
    saved=sessionStorage.getItem('edu-active')||localStorage.getItem('edu-session');
    const p=new URLSearchParams(location.search);
    hasLink=p.has('view_content')||p.has('view_folder');
  }catch(e){}

  if(saved){
    try{
      const s=JSON.parse(saved);
      const v=DB.users.find(u=>u?.username===s?.username&&u?.password===s?.password);
      if(v){currentUser=v;initDash();return}
    }catch(e){}
  }
  if(hasLink){guestMode=true;currentUser={username:'زائر',role:'guest',isStar:false};initDash();return}
  $('pg-login').classList.remove('hidden');
  try{
    const rem=localStorage.getItem('edu-remember');
    if(rem){const d=JSON.parse(rem);$('login-user').value=d?.username||'';$('login-pass').value=d?.password||'';$('remember-me').checked=true}
  }catch(e){}
}

function login(){
  const u=$('login-user').value.trim(),p=$('login-pass').value.trim();
  if(DB.pendingUsers.find(x=>x?.username===u&&x?.password===p))return toast('حسابك قيد المراجعة الإدارية','warning');
  const user=DB.users.find(x=>x?.username===u&&x?.password===p);
  if(!user)return toast('بيانات الدخول غير صحيحة','error');
  const sid=Date.now().toString(36)+Math.random().toString(36).slice(2);
  user.sessionId=sid;
  try{
    localStorage.setItem('edu-session',JSON.stringify(user));
    localStorage.setItem('edu-sid',sid);
    if($('remember-me').checked)localStorage.setItem('edu-remember',JSON.stringify({username:u,password:p}));
    else localStorage.removeItem('edu-remember');
  }catch(e){}
  const idx=DB.users.findIndex(x=>x?.username===u);
  if(idx>-1){DB.users[idx].sessionId=sid;saveToDB()}
  currentUser=user;guestMode=false;initDash();
}

function logout(c=true){
  try{localStorage.removeItem('edu-session');sessionStorage.removeItem('edu-active');if(c)localStorage.removeItem('edu-sid')}catch(e){}
  location.href=location.pathname;
}

function showReg(){$('pg-login').classList.add('hidden');$('pg-register').classList.remove('hidden')}
function showLogin(){$('pg-register').classList.add('hidden');$('pg-login').classList.remove('hidden')}

function submitReg(){
  const u=escH($('reg-user').value.trim()),p=$('reg-pass').value.trim(),c=escH($('reg-class').value.trim());
  if(!u||!p||!c)return toast('يرجى استكمال جميع الحقول','error');
  if(DB.users.find(x=>x?.username===u)||DB.pendingUsers.find(x=>x?.username===u))return toast('هذا المعرّف مستخدم مسبقاً','error');
  DB.pendingUsers.push({username:u,password:p,class:c,role:'student',isStar:false});
  saveToDB();['reg-user','reg-pass','reg-class'].forEach(id=>$(id).value='');
  toast('أُرسل طلبك للمراجعة الإدارية');showLogin();
}

function approveUser(u){const i=DB.pendingUsers.findIndex(x=>x?.username===u);if(i>-1){DB.users.push(DB.pendingUsers[i]);DB.pendingUsers.splice(i,1);saveToDB();toast('تم تفعيل الحساب');renderPending();updateClassesDrop()}}
function rejectUser(u){if(confirm('هل أنت متأكد من الرفض؟')){DB.pendingUsers=DB.pendingUsers.filter(x=>x?.username!==u);saveToDB();toast('تم رفض الحساب');renderPending()}}

/* ── Init ── */
function initDash(){
  ['pg-login','pg-register'].forEach(id=>$(id).classList.add('hidden'));
  $('main-header').classList.remove('hidden');

  if(guestMode){
    const p=new URLSearchParams(location.search);
    const vC=p.get('view_content');
    $('welcome-msg').textContent='زائر';
    $('user-pill').style.display='flex';
    $('btn-logout').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> <span>دخول</span>';
    if(vC){$('btn-sidebar-tog').classList.add('hidden');$('student-sidebar').style.display='none'}
    else{$('btn-sidebar-tog').classList.remove('hidden');$('student-sidebar').style.display='flex'}
    showStudentDash();return;
  }

  $('welcome-msg').textContent=escH(currentUser?.username);
  $('user-pill').style.display='flex';

  if(currentUser?.role==='admin'){
    $('btn-install').classList.add('hidden');
    if(localStorage.getItem('adm-preview-'+currentUser?.username)==='true')showPreview(true);
    else{$('pg-admin').classList.remove('hidden');$('btn-preview').classList.remove('hidden');refreshDash()}
  }else{
    $('btn-sidebar-tog').classList.remove('hidden');
    $('student-sidebar').style.display='flex';
    showStudentDash();
  }
}

function refreshDash(){
  if(currentUser?.role==='admin'&&!previewMode){
    renderAdminFolders();updateFolderDrop();filterContents();filterUsers();updateClassesDrop();renderPending();
    openTab(null,localStorage.getItem('adm-tab-'+currentUser?.username)||'t-add');
  }else showStudentDash();
}

function openTab(e,id){
  document.querySelectorAll('.tab-pane').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=$(id);if(el)el.classList.add('active');
  if(e){e.currentTarget.classList.add('active');e.currentTarget.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
  else{const b=document.querySelector(`[onclick*="${id}"]`);if(b)b.classList.add('active')}
  if(currentUser?.role==='admin')localStorage.setItem('adm-tab-'+currentUser?.username,id);
}

/* ── Sidebar Toggle ── */
function toggleSidebar(){
  const sb=$('student-sidebar'),bd=$('sidebar-backdrop');
  if(window.innerWidth<768){
    const open=sb.classList.contains('mobile-open');
    if(open){sb.classList.remove('mobile-open');bd.classList.remove('active');document.body.style.overflow=''}
    else{sb.classList.add('mobile-open');bd.classList.add('active');document.body.style.overflow='hidden'}
  }else sb.classList.toggle('collapsed');
}
function closeSidebarMobile(){
  $('student-sidebar').classList.remove('mobile-open');
  $('sidebar-backdrop').classList.remove('active');
  document.body.style.overflow='';
}
$('sidebar-backdrop').addEventListener('click',closeSidebarMobile);

function sidebarItemClick(id,el){
  if(window.innerWidth<768)closeSidebarMobile();
  showContent(id,el);
}

/* ── Dropdowns ── */
function updateClassesDrop(){
  const s=$('c-classes');if(!s)return;
  const v=s.value;
  s.innerHTML='<option value="all">متاح للكل (الافتراضي)</option><option value="admin">مسودة للإدارة</option>';
  const set=new Set();
  DB.users.forEach(u=>{if(u?.role==='student'&&u?.class)set.add(u.class)});
  DB.contents.forEach(c=>{if(c?.classes)c.classes.forEach(x=>{if(x!=='admin_only')set.add(x)})});
  set.forEach(x=>s.innerHTML+=`<option value="${escH(x)}">${escH(x)}</option>`);
  if(v&&[...s.options].some(o=>o.value===v))s.value=v;
}
function updateFolderDrop(){
  const s=$('c-folder');if(!s)return;
  s.innerHTML='<option value="none">مستقل</option>';
  DB.folders.forEach(f=>s.innerHTML+=`<option value="${escH(f)}">${escH(f)}</option>`);
}

/* ── Folders ── */
function addFolder(){
  const f=escH($('new-folder').value.trim());
  if(!f||DB.folders.includes(f))return toast('هذا المجلد موجود مسبقاً','error');
  DB.folders.push(f);saveToDB();$('new-folder').value='';
  renderAdminFolders();updateFolderDrop();toast('تمت إضافة المجلد');
}
function editFolder(old){
  const n=prompt('الاسم الجديد:',old);if(!n||!n.trim()||n===old)return;
  const t=escH(n.trim());
  if(DB.folders.includes(t))return toast('الاسم الجديد مستخدم','error');
  DB.folders[DB.folders.indexOf(old)]=t;
  DB.contents.forEach(c=>{if(c?.folder===old)c.folder=t});
  saveToDB();renderAdminFolders();updateFolderDrop();filterContents();toast('تم تحديث اسم المجلد');
}
function deleteFolder(f){
  if(!confirm('سيتم فك ارتباط الدروس المرتبطة. متابعة؟'))return;
  DB.folders=DB.folders.filter(x=>x!==f);
  DB.contents.forEach(c=>{if(c?.folder===f)c.folder='none'});
  saveToDB();renderAdminFolders();updateFolderDrop();filterContents();toast('تم حذف المجلد');
}

/* ── Content CRUD ── */
function saveContent(){
  const t=escH($('c-title').value.trim()),ty=$('c-type').value,
        f=$('c-folder').value,d=$('c-data').value.trim(),
        c=$('c-classes').value;
  if(!t||!d)return toast('يرجى ملء العنوان والمحتوى','error');
  const arr=c==='admin'?['admin_only']:c==='all'?[]:[c];
  if(editContentId){
    const idx=DB.contents.findIndex(x=>x?.id===editContentId);
    if(idx>-1)DB.contents[idx]={id:editContentId,title:t,type:ty,data:d,classes:arr,folder:f};
    cancelEditContent();toast('تم تحديث المحتوى بنجاح');
  }else{
    DB.contents.push({id:Date.now(),title:t,type:ty,data:d,classes:arr,folder:f});
    $('c-title').value='';$('c-data').value='';$('c-classes').value='all';
    toast('تم نشر المادة العلمية بنجاح');
  }
  saveToDB();filterContents();
}
function filterContents(){
  const term=$('srch-contents').value.toLowerCase();
  const l=$('adm-contents-list');l.innerHTML='';
  const res=DB.contents.filter(i=>i?.title?.toLowerCase().includes(term)||(i?.folder||'').toLowerCase().includes(term));
  if(!res.length)return l.innerHTML=emptyState('لا توجد نتائج','<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>');
  [...res].reverse().forEach(i=>{
    const cl=i.classes?.includes('admin_only')?`<span class="badge badge-red">مسودة</span>`:(!i.classes?.length?`<span class="badge badge-green">للكل</span>`:`<span class="badge badge-blue">${escH(i.classes[0])}</span>`);
    l.innerHTML+=`<div class="adm-row">
      <div class="adm-row-info" style="min-width:0;flex:1">
        <div class="adm-row-title">
          <input type="checkbox" class="chk-c" value="${i?.id}" style="margin-left:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fl-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          ${escH(i?.title)}
        </div>
        <div class="adm-row-meta">
          <span>${i?.folder==='none'||!i?.folder?'مستقل':escH(i?.folder)}</span>
          <span>${i?.type==='html'?'HTML':'رابط'}</span>
          ${cl}
        </div>
      </div>
      <div class="adm-row-actions">
        <button class="btn-icon" onclick="copyLink('content','${i?.id}',this)" title="نسخ رابط الدرس">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <button class="btn-icon warning" onclick="editContent(${i?.id})" title="تعديل">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon danger" onclick="deleteContent(${i?.id})" title="حذف">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>`;
  });
}
function deleteContent(id){if(confirm('هل تريد حذف هذا الدرس نهائياً؟')){DB.contents=DB.contents.filter(c=>c?.id!==id);saveToDB();filterContents();toast('تم حذف الدرس')}}
function toggleAllContents(src){document.querySelectorAll('.chk-c').forEach(cb=>cb.checked=src?.checked)}
function deleteSelectedContents(){
  const sel=Array.from(document.querySelectorAll('.chk-c:checked')).map(cb=>parseInt(cb.value));
  if(!sel.length)return toast('لم تختر أي عناصر','warning');
  if(confirm('حذف العناصر المحددة نهائياً؟')){DB.contents=DB.contents.filter(c=>!sel.includes(c?.id));saveToDB();filterContents();toast('تم الحذف الجماعي')}
}
function editContent(id){
  const i=DB.contents.find(c=>c?.id===id);if(!i)return;
  $('c-title').value=i.title;$('c-type').value=i.type;
  $('c-folder').value=i.folder||'none';$('c-data').value=i.data;
  $('c-classes').value=i.classes?.includes('admin_only')?'admin':(!i.classes?.length?'all':i.classes[0]);
  editContentId=id;
  $('btn-save-content').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> تطبيق التعديل';
  $('btn-cancel-content').classList.remove('hidden');
  openTab(null,'t-add');window.scrollTo(0,0);
}
function cancelEditContent(){
  editContentId=null;$('c-title').value='';$('c-data').value='';$('c-classes').value='all';
  $('btn-save-content').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ المادة';
  $('btn-cancel-content').classList.add('hidden');
}

/* ── Users CRUD ── */
function genPass(){$('u-pass').value=Math.random().toString(36).slice(-6)+Math.floor(Math.random()*99)}
function saveUser(){
  const u=escH($('u-name').value.trim()),p=$('u-pass').value.trim(),
        c=escH($('u-class').value.trim()),s=$('u-star').checked;
  if(!u||!p)return toast('بيانات الوصول غير مكتملة','error');
  if(editUserOld){
    if(u!==editUserOld&&DB.users.find(x=>x?.username===u))return toast('هذا المعرّف مستخدم مسبقاً','error');
    DB.users[DB.users.findIndex(x=>x?.username===editUserOld)]={username:u,password:p,role:'student',class:c,isStar:s};
    cancelEditUser();toast('تم تعديل الحساب بنجاح');
  }else{
    if(DB.users.find(x=>x?.username===u))return toast('المعرّف موجود مسبقاً','error');
    DB.users.push({username:u,password:p,role:'student',class:c,isStar:s});
    ['u-name','u-pass','u-class'].forEach(id=>$(id).value='');$('u-star').checked=false;
    toast('تم تسجيل الطالب بنجاح');
  }
  saveToDB();filterUsers();
}
function filterUsers(){
  const term=$('srch-users').value.toLowerCase();
  const l=$('adm-users-list');l.innerHTML='';
  const res=DB.users.filter(u=>u?.role==='student'&&(u?.username?.toLowerCase().includes(term)||(u?.class||'').toLowerCase().includes(term)));
  if(!res.length)return l.innerHTML=emptyState('لا يوجد مستخدمون مطابقون','<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>');
  [...res].reverse().forEach(u=>{
    l.innerHTML+=`<div class="adm-row">
      <div class="adm-row-info" style="flex:1;min-width:0">
        <div class="adm-row-title">
          <input type="checkbox" class="chk-u" value="${escH(u?.username)}" style="margin-left:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fl-teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ${escH(u?.username)}
        </div>
        <div class="adm-row-meta">
          <span>${escH(u?.class)||'—'}</span>
          ${u?.isStar?'<span class="badge badge-amber">⭐ VIP</span>':''}
        </div>
      </div>
      <div class="adm-row-actions">
        <button class="btn-icon" onclick="copyCreds('${escH(u?.username)}','${escH(u?.password)}',this)" title="نسخ بيانات الدخول">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="btn-icon warning" onclick="editUser('${escH(u?.username)}')" title="تعديل">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon danger" onclick="deleteUser('${escH(u?.username)}')" title="حذف">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/></svg>
        </button>
      </div>
    </div>`;
  });
}
function deleteUser(u){if(confirm('هل تريد حذف هذا الحساب؟')){DB.users=DB.users.filter(x=>x?.username!==u);saveToDB();filterUsers();toast('تم حذف الحساب')}}
function toggleAllUsers(src){document.querySelectorAll('.chk-u').forEach(cb=>cb.checked=src?.checked)}
function deleteSelectedUsers(){
  const sel=Array.from(document.querySelectorAll('.chk-u:checked')).map(cb=>cb.value);
  if(!sel.length)return toast('لم تختر أي عناصر','warning');
  if(confirm('حذف الحسابات المختارة؟')){DB.users=DB.users.filter(u=>!sel.includes(u?.username));saveToDB();filterUsers();toast('تم الحذف الجماعي')}
}
function editUser(u){
  const i=DB.users.find(x=>x?.username===u);if(!i)return;
  $('u-name').value=i.username;$('u-pass').value=i.password;
  $('u-class').value=i.class||'';$('u-star').checked=i.isStar;
  editUserOld=u;
  $('btn-save-user').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> حفظ التعديلات';
  $('btn-cancel-user').classList.remove('hidden');
  openTab(null,'t-add-user');window.scrollTo(0,0);
}
function cancelEditUser(){
  editUserOld=null;['u-name','u-pass','u-class'].forEach(id=>$(id).value='');$('u-star').checked=false;
  $('btn-save-user').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> تثبيت الحساب';
  $('btn-cancel-user').classList.add('hidden');
}

/* ── Settings ── */
function updateAdminCreds(){
  const u=escH($('adm-new-user').value.trim()),p=$('adm-new-pass').value;
  if(!u||!p)return toast('يرجى إدخال المعرف والمرور','warning');
  DB.users[0].username=u;DB.users[0].password=p;saveToDB();
  alert('تم التحديث. سيتم إغلاق الجلسة الآن.');logout();
}
function exportDB(){
  const a=document.createElement('a');
  a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB));
  a.download='DB_Platform_'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove();
}
function importDB(){
  const f=$('import-file');if(!f.files.length)return;
  if(!confirm('سيُحل هذا الملف محل قاعدة البيانات الحالية. هل أنت متأكد؟'))return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.users){DB=d;saveToDB();refreshDash();toast('تمت الاستعادة بنجاح')}}catch(err){toast('الملف غير صالح','error')}};
  r.readAsText(f.files[0]);
}

/* ── Preview ── */
function showPreview(init=false){
  previewMode=true;
  if(currentUser)localStorage.setItem('adm-preview-'+currentUser?.username,'true');
  $('pg-admin').classList.add('hidden');
  $('btn-preview').classList.add('hidden');
  $('btn-back-admin').classList.remove('hidden');
  $('btn-sidebar-tog').classList.remove('hidden');
  const sb=$('student-sidebar');sb.style.display='flex';sb.classList.remove('collapsed');
  showStudentDash();
  if(!init)toast('وضع المعاينة النشط — أنت ترى واجهة الطالب');
}
function backToAdmin(){
  previewMode=false;
  if(currentUser)localStorage.setItem('adm-preview-'+currentUser?.username,'false');
  $('pg-student').classList.add('hidden');
  $('pg-admin').classList.remove('hidden');
  $('btn-preview').classList.remove('hidden');
  $('btn-back-admin').classList.add('hidden');
  $('btn-sidebar-tog').classList.add('hidden');
  closeSidebarMobile();refreshDash();toast('عدت إلى لوحة الإدارة');
}

/* ── Visibility ── */
function canView(i){
  if(guestMode)return true;
  if(!i?.classes||!i.classes.length)return true;
  if(i.classes.includes('admin_only'))return currentUser?.role==='admin'&&!previewMode;
  if(currentUser?.role==='admin'&&!previewMode)return true;
  if(currentUser?.isStar)return true;
  return i.classes.includes(currentUser?.class);
}

/* ── Sidebar Filter ── */
function filterSidebar(){
  try{
    const t=$('sb-search').value.toLowerCase();
    document.querySelectorAll('#sb-content details').forEach(d=>{
      let v=false;
      d.querySelectorAll('li').forEach(l=>{
        const show=l.textContent.toLowerCase().includes(t);
        l.style.display=show?'flex':'none';if(show)v=true;
      });
      d.style.display=v?'block':'none';if(v&&t)d.open=true;
    });
    document.querySelectorAll('#sb-content .ind-item').forEach(i=>{
      i.style.display=i.textContent.toLowerCase().includes(t)?'flex':'none';
    });
  }catch(e){}
}

function searchAll(){
  const t=$('sb-search').value.toLowerCase();
  let res=DB.contents.filter(canView);
  if(t)res=res.filter(i=>i?.title?.toLowerCase().includes(t));
  renderItems([...res].reverse());
  document.querySelectorAll('.acc-item,.ind-item').forEach(e=>e.classList.remove('active'));
  if(window.innerWidth<768)closeSidebarMobile();
}

/* ── Student Dashboard ── */
function showStudentDash(){
  try{
    $('pg-student').classList.remove('hidden');
    let vC=null,vF=null;
    try{const p=new URLSearchParams(location.search);vC=p.get('view_content');vF=p.get('view_folder')}catch(e){}

    let res=DB.contents.filter(canView);
    if(guestMode){
      if(vF)res=res.filter(c=>c?.folder===vF);
      else if(vC){const s=res.find(c=>c?.id==vC);res=s?[s]:[]}
    }

    const sb=$('sb-content');sb.innerHTML='';
    let grp={},ind=[];
    res.forEach(i=>{
      if(i?.folder&&i.folder!=='none'){if(!grp[i.folder])grp[i.folder]=[];grp[i.folder].push(i)}
      else ind.push(i);
    });

    let h='';
    for(const f in grp){
      const fEsc=escH(f);
      h+=`<details ${guestMode?'open':''} class="acc">
        <summary>
          <svg class="acc-folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="acc-label">${fEsc}</span>
          <button onclick="event.stopPropagation();event.preventDefault();copyLink('folder','${fEsc}',this)" class="acc-copy-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            نسخ
          </button>
          <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <ul>`;
      grp[f].forEach(i=>{h+=`<li class="acc-item" onclick="sidebarItemClick(${i?.id},this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${escH(i?.title)}</li>`});
      h+=`</ul></details>`;
    }
    ind.forEach(i=>{h+=`<div class="ind-item" onclick="sidebarItemClick(${i?.id},this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${escH(i?.title)}</div>`});
    sb.innerHTML=h||emptyState('الفهرس فارغ حالياً','<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>');

    // Single-open accordion
    const allD=sb.querySelectorAll('details.acc');
    allD.forEach(d=>d.addEventListener('toggle',()=>{if(d.open)allD.forEach(o=>{if(o!==d&&o.open)o.open=false})}));

    const sid=localStorage.getItem('last-content-'+(currentUser?.username||'g'));
    const load=vC?res.find(c=>c?.id==vC):(sid&&!guestMode?res.find(c=>c?.id==sid):null);
    if(load){
      setTimeout(()=>{
        let el=null;
        document.querySelectorAll('.acc-item,.ind-item').forEach(e=>{if(e.getAttribute('onclick')?.includes(load.id))el=e});
        showContent(load.id,el);if(el?.closest('details'))el.closest('details').open=true;
      },60);
    }else if(vF){
      setTimeout(()=>{
        renderItems([...res].filter(c=>c?.folder===vF).reverse());
        document.querySelectorAll('#sb-content summary').forEach(s=>{if(s.textContent.includes(vF))s.closest('details').open=true});
      },60);
    }else{
      $('content-display').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-muted);gap:16px;text-align:center">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.3"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <div style="font-size:15px;font-weight:700">اختر درساً من الفهرس الجانبي للبدء</div>
        <div style="font-size:13px;opacity:.7">يمكنك البحث في الفهرس باستخدام خانة البحث</div>
      </div>`;
    }
  }catch(e){console.error('StudentDash',e)}
}

function setActive(el){document.querySelectorAll('.acc-item,.ind-item').forEach(e=>e.classList.remove('active'));if(el)el.classList.add('active')}

function showContent(id,el){
  if(el)setActive(el);
  const i=DB.contents.find(c=>c?.id===id);
  if(i){renderItems([i]);if(currentUser&&!guestMode)localStorage.setItem('last-content-'+currentUser.username,id)}
}

/* ── Render Items ── */
function renderItems(arr){
  try{
    const d=$('content-display');d.innerHTML='';
    if(!arr.length)return d.innerHTML=emptyState('لا يوجد محتوى للعرض','<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>');
    arr.forEach(i=>{
      const div=document.createElement('div');div.className='content-card amiri';
      const copyBtn=`<button onclick="copyLink('content',${i?.id},this)" class="btn-subtle" style="padding:5px 12px;font-size:12px;border-radius:var(--r-full)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        رابط الدرس
      </button>`;

      let body='';
      if(i?.type==='html'){
        const wid=`ifw-${i?.id}`;
        let safe=i.data
          .replace(/user-scalable=[a-z0-9]+/gi,'user-scalable=yes')
          .replace(/maximum-scale=[0-9.]+/gi,'maximum-scale=5.0');
        const inj=`<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><style>html,body{margin:0!important;padding:0!important;width:100%!important;touch-action:pan-x pan-y pinch-zoom!important}iframe{width:100%!important;height:100vh!important;border:none!important}</style>`;
        if(!safe.includes('touch-action'))safe=safe.includes('</head>')?safe.replace(/<\/head>/i,inj+'</head>'):inj+safe;
        const titleEsc=escH(i?.title||'');
        safe=safe.replace(/"/g,'&quot;');
        body=`
        <div class="content-card-header">
          <div class="content-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            ${escH(i?.title)}
          </div>
          <div class="content-card-actions">
            ${copyBtn}
            <button onclick="enterFS('${wid}')" class="btn-subtle" style="padding:5px 12px;font-size:12px;border-radius:var(--r-full)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              ملء الشاشة
            </button>
          </div>
        </div>
        <div class="content-card-body" style="padding:12px">
          <div id="${wid}" class="iframe-wrap">
            <!-- Top Bar -->
            <div class="fs-bar fs-top">
              <button class="fs-close-btn" onclick="exitFS('${wid}')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                إغلاق ملء الشاشة
              </button>
              <span class="fs-title">${titleEsc}</span>
            </div>
            <!-- Toggle Bars Btn -->
            <button class="fs-toggle-btn" onclick="toggleBars('${wid}')" title="إظهار / إخفاء الأشرطة">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            </button>
            <iframe class="html-sandbox" srcdoc="${safe}" allowfullscreen loading="lazy"></iframe>
            <!-- Bottom Bar -->
            <div class="fs-bar fs-bot"></div>
          </div>
        </div>`;
      }else{
        body=`
        <div class="content-card-header">
          <div class="content-card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            ${escH(i?.title)}
          </div>
          <div class="content-card-actions">${copyBtn}</div>
        </div>
        <div class="content-card-body">
          <a href="${escH(i?.data)}" target="_blank" rel="noopener noreferrer" class="link-content-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            الانتقال للمحتوى الخارجي
          </a>
        </div>`;
      }
      div.innerHTML=body;d.appendChild(div);
    });
  }catch(e){console.error('RenderItems',e);toast('خطأ في عرض المحتوى','error')}
}

/* ── Empty State Helper ── */
function emptyState(msg,iconPath){
  return`<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg>${msg}</div>`;
}
</script>
