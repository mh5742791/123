<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function(){
    /* Viewport: native device width — mobile UI handles layout */
    var meta=document.createElement('meta');
    meta.name='viewport';
    meta.content='width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes';
    document.head.insertBefore(meta,document.head.firstChild);
    var s=Math.min(screen.width,screen.height);
    window.__isPhone=s<768;
    window.__deviceType=window.__isPhone?'phone':'tablet';
    document.documentElement.setAttribute('data-device',window.__deviceType);
}());
</script>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المنصة التعليمية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>المنصة التعليمية | الإصدار الاحترافي المتكامل</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
/* ════════════════════════════════════════════════
   CSS Variables & Theming
   ════════════════════════════════════════════════ */
:root{
    --primary:#2563eb;--primary-hover:#1d4ed8;--primary-light:#eff6ff;
    --primary-gradient:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%);
    --secondary:#0ea5e9;--secondary-hover:#0284c7;
    --bg-color:#f8fafc;--card-bg:#ffffff;--text-main:#0f172a;--text-muted:#475569;
    --border:#e2e8f0;--border-light:#f1f5f9;
    --success:#10b981;--success-hover:#059669;--danger:#ef4444;--danger-hover:#dc2626;
    --warning:#f59e0b;--warning-hover:#d97706;
    --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05);--shadow-sm:0 2px 4px 0 rgba(0,0,0,.06);
    --shadow-md:0 6px 10px -2px rgba(0,0,0,.1);--shadow-lg:0 15px 20px -5px rgba(0,0,0,.1);
    --focus-ring:0 0 0 4px rgba(37,99,235,.15);
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;
    --transition-fast:0.2s ease;--transition-smooth:0.3s cubic-bezier(.4,0,.2,1);
}
body.dark-mode{
    --primary:#3b82f6;--primary-hover:#60a5fa;--primary-light:#1e3a8a;
    --primary-gradient:linear-gradient(135deg,#60a5fa 0%,#2563eb 100%);
    --bg-color:#0f172a;--card-bg:#1e293b;--text-main:#f8fafc;--text-muted:#94a3b8;
    --border:#334155;--border-light:#1e293b;
    --shadow-sm:0 2px 4px 0 rgba(0,0,0,.3);--shadow-md:0 6px 10px -2px rgba(0,0,0,.4);
    --shadow-lg:0 15px 20px -5px rgba(0,0,0,.5);--focus-ring:0 0 0 4px rgba(59,130,246,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
    font-family:'Cairo',system-ui,sans-serif;
    background-color:var(--bg-color);color:var(--text-main);
    line-height:1.7;overflow-x:hidden;
    transition:var(--transition-smooth);
    display:flex;flex-direction:column;min-height:100vh;font-size:16px;
}
.academic-text{font-family:'Amiri',serif;font-size:18px;line-height:2;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-color);}
::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--primary);}
.hidden{display:none!important;}
.container,#user-layout{max-width:1440px;margin:0 auto;padding:25px;flex:1;width:100%;}

/* Loading */
#loading-overlay{
    position:fixed;inset:0;background:rgba(248,250,252,.95);backdrop-filter:blur(8px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    z-index:999999;transition:opacity .4s;
}
body.dark-mode #loading-overlay{background:rgba(15,23,42,.95);}
.loader-core{
    width:60px;height:60px;border:4px solid var(--border);
    border-top-color:var(--primary);border-radius:50%;
    animation:spin .8s ease-in-out infinite;margin-bottom:20px;
}
#loading-text{color:var(--text-main);font-weight:800;font-size:18px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Toast */
#toast-container{
    position:fixed;bottom:80px;left:20px;
    z-index:100000;display:flex;flex-direction:column;gap:15px;pointer-events:none;
}
.toast{
    padding:14px 20px;border-radius:var(--radius-md);color:white;font-weight:700;
    animation:slideIn .4s cubic-bezier(.2,.8,.2,1),fadeOut .4s 4s forwards;
    box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;
    max-width:380px;font-size:15px;white-space:pre-wrap;
}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}
.toast.warning{background:var(--warning);}
.toast svg{width:22px;height:22px;flex-shrink:0;}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes fadeOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(15px);}}

/* Form Controls */
.input-group{margin-bottom:20px;width:100%;}
.input-label{display:block;font-weight:800;margin-bottom:8px;color:var(--text-main);font-size:15px;}
input[type="text"],input[type="password"],select,textarea{
    width:100%;padding:14px 18px;border:2px solid var(--border);
    border-radius:var(--radius-md);font-size:16px;font-family:'Cairo',sans-serif;
    background-color:var(--card-bg);font-weight:600;color:var(--text-main);
    transition:var(--transition-fast);box-shadow:inset 0 2px 4px rgba(0,0,0,.02);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--focus-ring);}
button{
    background:var(--primary);color:white;border:none;padding:12px 24px;
    border-radius:var(--radius-md);cursor:pointer;font-size:16px;font-weight:800;
    font-family:'Cairo',sans-serif;transition:var(--transition-fast);
    display:inline-flex;align-items:center;justify-content:center;
    gap:10px;box-shadow:var(--shadow-sm);
}
button:hover{background:var(--primary-hover);transform:translateY(-2px);box-shadow:var(--shadow-md);}
button:active{transform:translateY(0);box-shadow:none;}
.btn-danger{background:var(--danger);}.btn-danger:hover{background:var(--danger-hover);}
.btn-success{background:var(--success);}.btn-success:hover{background:var(--success-hover);}
.btn-warning{background:var(--warning);color:#fff;}.btn-warning:hover{background:var(--warning-hover);}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text-main);box-shadow:none;}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
.btn-secondary{background:var(--bg-color);color:var(--text-main);border:2px solid var(--border);box-shadow:none;}
.btn-secondary:hover{border-color:var(--text-muted);}
.btn-icon-only{padding:8px;background:transparent;color:var(--text-muted);box-shadow:none;border:1px solid transparent;}
.btn-icon-only:hover{background:var(--bg-color);color:var(--primary);border-color:var(--border);}
svg.icon{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* Auth */
.auth-section{display:flex;justify-content:center;align-items:center;height:100vh;background:var(--bg-color);}
.login-box{
    background:var(--card-bg);padding:45px 40px;border-radius:var(--radius-xl);
    box-shadow:var(--shadow-lg);width:100%;max-width:450px;text-align:center;border:1px solid var(--border);
}
.login-box h2{color:var(--text-main);font-size:26px;margin-bottom:30px;font-weight:900;}
.remember-container{
    display:flex;align-items:center;gap:10px;margin-bottom:25px;cursor:pointer;
    color:var(--text-muted);font-size:15px;font-weight:700;
}
.remember-container input{width:18px;height:18px;cursor:pointer;accent-color:var(--primary);}

/* Header */
header{
    background:rgba(255,255,255,.98);backdrop-filter:blur(12px);
    padding:15px 30px;display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);
}
body.dark-mode header{background:rgba(30,41,59,.98);}
.header-right{display:flex;align-items:center;gap:20px;}
header h3{margin:0;color:var(--primary);font-size:22px;font-weight:900;display:flex;align-items:center;gap:12px;}
.logo-box{background:var(--primary-gradient);padding:8px;border-radius:10px;color:white;display:flex;box-shadow:var(--shadow-sm);}
.header-left{display:flex;align-items:center;gap:12px;}
.user-badge{
    font-weight:800;color:var(--text-main);font-size:15px;
    background:var(--bg-color);padding:8px 16px;border-radius:20px;
    border:1px solid var(--border);display:flex;align-items:center;gap:8px;
}

/* Tabs */
.tabs-container{margin-top:10px;}
.tabs-header{
    display:flex;flex-wrap:wrap;gap:10px;
    margin-bottom:25px;border-bottom:2px solid var(--border);padding-bottom:15px;
}
.tab-btn{
    background:transparent;color:var(--text-muted);padding:12px 20px;
    border-radius:var(--radius-md);font-size:16px;font-weight:800;box-shadow:none;border:1px solid transparent;
}
.tab-btn:hover{background:var(--card-bg);border-color:var(--border);color:var(--text-main);}
.tab-btn.active{background:var(--primary-gradient);color:white;border-color:transparent;box-shadow:var(--shadow-md);}
.tab-content{padding:0;display:none;animation:fadeIn .3s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Admin Cards */
.admin-card{
    background:var(--card-bg);padding:35px;border-radius:var(--radius-xl);
    border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:25px;
}
.admin-title{
    font-size:22px;font-weight:900;margin:0 0 25px;display:flex;align-items:center;gap:12px;
    border-bottom:2px solid var(--border);padding-bottom:15px;color:var(--text-main);
}
.admin-list-item{
    background:var(--bg-color);border:1px solid var(--border);
    padding:20px 25px;border-radius:var(--radius-lg);margin-bottom:15px;
    display:flex;justify-content:space-between;align-items:center;transition:var(--transition-fast);
}
.admin-list-item:hover{border-color:var(--primary);box-shadow:var(--shadow-md);background:var(--card-bg);}
.admin-item-meta{font-size:14px;color:var(--text-muted);display:flex;gap:20px;font-weight:600;}
.admin-item-actions{display:flex;gap:10px;}
.search-container{position:relative;width:100%;max-width:450px;margin-bottom:20px;}
.search-container input{padding:14px 45px 14px 20px;margin-bottom:0;border-radius:var(--radius-lg);font-size:16px;}
.bulk-action-bar{
    background:var(--card-bg);border:2px dashed var(--border);
    padding:15px 25px;border-radius:var(--radius-lg);margin-bottom:25px;
    display:flex;justify-content:space-between;align-items:center;
}
.bulk-action-bar label{font-size:15px;font-weight:800;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--text-main);}
input[type="checkbox"]{width:20px;height:20px;cursor:pointer;accent-color:var(--primary);border-radius:4px;border:2px solid var(--border);}
.empty-state{
    text-align:center;padding:50px 20px;color:var(--text-muted);
    background:var(--bg-color);border-radius:var(--radius-xl);
    border:2px dashed var(--border);margin:25px 0;font-weight:700;
    font-size:18px;display:flex;flex-direction:column;align-items:center;gap:15px;
}
.empty-state svg{width:60px;height:60px;}

/* Student Layout */
#user-layout{display:flex;gap:35px;align-items:flex-start;padding:0;}
.sidebar{
    width:340px;background:var(--card-bg);padding:25px;
    border-radius:var(--radius-xl);border:1px solid var(--border);
    box-shadow:var(--shadow-md);flex-shrink:0;
    height:fit-content;max-height:85vh;overflow-y:auto;
    display:flex;flex-direction:column;
    position:sticky;top:95px;transition:all var(--transition-smooth);
}
.sidebar.collapsed{width:0;padding:0;border:none;margin:0;opacity:0;overflow:hidden;transform:translateX(20px);}
.sidebar h3{
    margin:0 0 25px;color:var(--text-main);font-weight:900;font-size:20px;
    display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--border);padding-bottom:15px;
}
.sidebar-search-box{display:flex;gap:10px;margin-bottom:25px;position:relative;}
.sidebar-search-box input{margin-bottom:0;padding:12px 12px 12px 45px;border-radius:var(--radius-md);font-size:15px;background:var(--bg-color);}

/* Accordion */
.premium-accordion{
    margin-bottom:12px;border-radius:var(--radius-md);
    border:1px solid var(--border);overflow:hidden;transition:var(--transition-fast);background:var(--bg-color);
}
.premium-accordion:hover{border-color:var(--primary);}
.premium-accordion summary{
    padding:16px 20px;font-weight:800;cursor:pointer;color:var(--text-main);
    display:flex;align-items:center;justify-content:space-between;
    list-style:none;user-select:none;font-size:16px;background:var(--card-bg);
}
.premium-accordion summary:hover{background:var(--bg-color);}
.premium-accordion summary::-webkit-details-marker{display:none;}
.summary-content{display:flex;align-items:center;gap:12px;flex:1;overflow:hidden;}
.summary-content span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.summary-actions{display:flex;align-items:center;gap:10px;}
.btn-copy-folder{
    padding:6px 10px;font-size:12px;border-radius:var(--radius-sm);
    background:var(--bg-color);color:var(--text-muted);border:1px solid var(--border);
    box-shadow:none;display:flex;align-items:center;gap:6px;transition:.2s;
    font-family:'Cairo',sans-serif;font-weight:700;
}
.btn-copy-folder:hover{background:var(--primary);color:white;border-color:var(--primary);}
.premium-accordion summary .arrow-icon{transition:transform .3s;color:var(--text-muted);width:18px;height:18px;}
.premium-accordion[open] summary .arrow-icon{transform:rotate(180deg);color:var(--primary);}
.premium-accordion[open] summary{border-bottom:2px solid var(--border);color:var(--primary);background:var(--bg-color);}
.premium-accordion ul{list-style:none;padding:6px 0;margin:0;background:var(--card-bg);}
.sidebar-item{
    padding:12px 35px 12px 20px;cursor:pointer;color:var(--text-muted);font-weight:700;
    transition:var(--transition-fast);display:flex;align-items:center;gap:12px;
    font-size:15px;border-right:3px solid transparent;
}
.sidebar-item:hover{color:var(--primary);background:var(--primary-light);border-right-color:var(--primary);}
.sidebar-item.active{background:var(--primary-light);color:var(--primary);font-weight:800;border-right-color:var(--primary);}
.independent-item{
    border-radius:var(--radius-md);margin-bottom:12px;padding:16px 20px;
    border:1px solid var(--border);cursor:pointer;font-weight:800;color:var(--text-main);
    display:flex;align-items:center;gap:12px;font-size:16px;
    background:var(--card-bg);box-shadow:var(--shadow-sm);border-right:4px solid transparent;
}
.independent-item:hover{border-color:var(--primary);background:var(--bg-color);border-right-color:var(--primary);}
.independent-item.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);border-right-color:var(--primary);}

/* Main Content */
.main-content{flex:1;min-width:0;display:flex;flex-direction:column;}
.content-grid{display:flex;flex-direction:column;gap:30px;flex:1;}
.content-item{
    background:var(--card-bg);padding:40px;border-radius:var(--radius-xl);
    border:1px solid var(--border);display:flex;flex-direction:column;
    box-shadow:var(--shadow-md);flex:1;position:relative;
}
.content-header{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:2px solid var(--border);padding-bottom:20px;
    margin-bottom:25px;flex-wrap:wrap;gap:15px;
}
.content-title{margin:0;color:var(--text-main);font-size:24px;font-weight:900;display:flex;align-items:center;gap:12px;}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* iFrame */
.iframe-responsive-wrapper{
    position:relative;width:100%;height:78vh;min-height:550px;
    background:var(--bg-color);border-radius:var(--radius-md);
    border:2px solid var(--border);overflow:auto;-webkit-overflow-scrolling:touch;
    box-shadow:inset var(--shadow-sm);
}
.html-sandbox{border:none;background:#fff;width:100%;height:100%;display:block;border-radius:calc(var(--radius-md) - 2px);}

/* Fullscreen */
.iframe-responsive-wrapper.css-fullscreen{
    position:fixed!important;inset:0!important;
    width:100vw!important;height:100vh!important;height:100dvh!important;
    background:#fff!important;border-radius:0!important;border:none!important;
    z-index:9999999!important;overflow:hidden!important;padding-top:60px!important;
}
.fullscreen-top-bar{
    display:none;position:absolute;top:0;left:0;right:0;height:60px;
    background:#1e293b;border-bottom:2px solid #0f172a;z-index:99999999;
    align-items:center;justify-content:flex-end;padding:0 20px;box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.iframe-responsive-wrapper.css-fullscreen .fullscreen-top-bar{display:flex;position:fixed;}
.fullscreen-close-btn{
    background:#ef4444;color:#fff;border:2px solid #fff;cursor:pointer;
    padding:8px 24px;border-radius:50px;display:flex;align-items:center;
    justify-content:center;gap:10px;font-family:'Cairo',sans-serif;
    font-weight:800;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,.2);white-space:nowrap;
}
.fullscreen-close-btn:hover{background:#dc2626;transform:scale(1.02);}
.fullscreen-close-btn svg{width:22px;height:22px;stroke-width:2.5;flex-shrink:0;}
.iframe-responsive-wrapper.css-fullscreen .html-sandbox{
    height:calc(100vh - 60px)!important;height:calc(100dvh - 60px)!important;border-radius:0;
}

/* Footer */
.version-footer{
    text-align:center;padding:20px;color:var(--text-muted);font-size:13px;font-weight:700;
    width:100%;margin-top:auto;border-top:1px solid var(--border);background:var(--card-bg);
}

/* ═══════════════════════════════════════════════════
   MOBILE BOTTOM NAV — الواجهة الهاتفية
   ═══════════════════════════════════════════════════ */
.mobile-bottom-nav{
    display:none; /* desktop: hidden */
    position:fixed;bottom:0;left:0;right:0;
    height:62px;background:var(--card-bg);
    border-top:1.5px solid var(--border);
    align-items:stretch;justify-content:space-around;
    z-index:5000;box-shadow:0 -4px 20px rgba(0,0,0,.10);
    padding:0;
}
.mob-nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;padding:6px 2px 8px;
    background:transparent;border:none;box-shadow:none;
    color:var(--text-muted);font-size:10px;font-weight:800;cursor:pointer;
    transition:color .2s,background .2s;border-radius:0;position:relative;
    transform:none!important;
}
.mob-nav-btn svg{width:22px;height:22px;transition:transform .2s;}
.mob-nav-btn:hover,.mob-nav-btn.mob-active{color:var(--primary);background:transparent;}
.mob-nav-btn.mob-active svg{transform:translateY(-2px);}
.mob-nav-btn.mob-active::after{
    content:'';position:absolute;top:0;left:20%;right:20%;
    height:3px;background:var(--primary);border-radius:0 0 4px 4px;
}
.mob-nav-badge{
    position:absolute;top:5px;right:calc(50% - 20px);
    background:var(--danger);color:white;font-size:9px;font-weight:900;
    border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;line-height:1.4;
}

/* FAB */
.mobile-fab{
    display:none;position:fixed;bottom:72px;left:18px;
    width:50px;height:50px;border-radius:50%;
    background:var(--primary-gradient);color:white;border:none;
    box-shadow:0 4px 18px rgba(37,99,235,.45);
    align-items:center;justify-content:center;
    z-index:5001;cursor:pointer;transition:.2s;padding:0;
}
.mobile-fab:hover{transform:scale(1.1);}
.mobile-fab svg{width:26px;height:26px;stroke-width:2.5;}

/* Drawer overlay */
#mobile-drawer-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.5);z-index:5999;backdrop-filter:blur(2px);
}
#mobile-drawer-overlay.visible{display:block;}

/* Mobile search overlay */
#mobile-search-overlay{
    position:fixed;inset:0;background:var(--bg-color);
    z-index:7000;padding:15px 14px 80px;
    display:none;flex-direction:column;gap:14px;overflow-y:auto;
}
#mobile-search-overlay.visible{display:flex;}
.mob-search-header{
    display:flex;align-items:center;gap:10px;
    padding-bottom:14px;border-bottom:2px solid var(--border);
}
.mob-search-header input{flex:1;margin:0;font-size:15px;}
.mob-search-header .close-search-btn{
    padding:10px;background:var(--bg-color);color:var(--text-main);
    border:2px solid var(--border);border-radius:var(--radius-md);
    min-width:44px;min-height:44px;
}
.mob-search-header .close-search-btn:hover{transform:none;}

/* Mobile users sub-nav (shown inside user tabs on mobile) */
.mobile-users-subnav{
    display:none;
    gap:8px;margin-bottom:18px;
    overflow-x:auto;padding-bottom:4px;
}
.mobile-users-subnav button{

<script>
'use strict';

/* ── Debounce ── */
function debounce(fn,ms=300){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
const processAdminContentSearch=debounce(()=>filterAdminContent());
const processAdminUserSearch=debounce(()=>filterAdminUsers());
const processStudentSearch=debounce(()=>filterSidebar(),150);

/* ── HTML Escape ── */
function escapeHTML(str){return str?String(str).replace(/[&<>'"]/g,t=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)):'';}

/* ── State ── */
let isGuestMode=false,currentUser=null,isPreviewMode=false;
let currentEditContentId=null,currentEditUserOldName=null;
let isFirstLoad=true,deferredPrompt=null;

/* ── Mobile Detection ── */
function isMobile(){return window.__isPhone||window.innerWidth<768;}

/* ── Firebase ── */
const firebaseConfig={
    apiKey:"AIzaSyAYfUWjixDK7MsaLNm9VudD0EIN-QeEDCw",
    authDomain:"tech-53a3b.firebaseapp.com",
    databaseURL:"https://tech-53a3b-default-rtdb.firebaseio.com",
    projectId:"tech-53a3b",
    storageBucket:"tech-53a3b.firebasestorage.app",
    messagingSenderId:"800965684824",
    appId:"1:800965684824:web:c2bea26af815f15aac642d"
};
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);}catch(e){}
const database=firebase.database();
let db={users:[],contents:[],folders:[],pendingUsers:[]};

/* ── PWA ── */
window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();deferredPrompt=e;
    const b=document.getElementById('install-pwa-btn');
    if(b&&(!currentUser||currentUser.role!=='admin'))b.classList.remove('hidden');
});
function installPWA(){
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(c=>{
        if(c.outcome==='accepted')document.getElementById('install-pwa-btn').classList.add('hidden');
        deferredPrompt=null;
    });
}

/* ── Toast ── */
function showToast(msg,type='success'){
    const c=document.getElementById('toast-container');
    const t=document.createElement('div');t.className=`toast ${type}`;
    const icons={success:'<polyline points="20 6 9 17 4 12"></polyline>',error:'<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',warning:'<line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'};
    t.innerHTML=`<svg class="icon" viewBox="0 0 24 24">${icons[type]||icons.success}</svg><span>${msg}</span>`;
    c.appendChild(t);setTimeout(()=>t.remove(),4400);
}

/* ── Dark Mode ── */
function toggleDarkMode(){document.body.classList.toggle('dark-mode');localStorage.setItem('eduDarkMode',document.body.classList.contains('dark-mode'));}
if(localStorage.getItem('eduDarkMode')==='true')document.body.classList.add('dark-mode');

/* ── DB ── */
function sanitizeArray(arr){return arr?Object.values(arr).filter(i=>i!=null):[];}

database.ref('/').on('value',snapshot=>{
    try{
        const data=snapshot.val();
        if(data){
            db.users=sanitizeArray(data?.users);
            db.contents=sanitizeArray(data?.contents);
            db.folders=sanitizeArray(data?.folders);
            db.pendingUsers=sanitizeArray(data?.pendingUsers);
            db.contents.forEach(item=>{if(!item?.classes)item.classes=[];if(!item?.ratio)item.ratio='16:9';});
        }else{
            db={users:[{username:'228820',password:'228820',role:'admin'}],contents:[],folders:[],pendingUsers:[]};
            saveDB();
        }
        if(isFirstLoad){
            document.getElementById('loading-overlay').classList.add('hidden');
            checkSession();isFirstLoad=false;
        }else if(currentUser&&!isGuestMode){
            const vUser=db.users.find(u=>u?.username===currentUser?.username&&u?.password===currentUser?.password);
            if(vUser){
                if(vUser?.role==='student'&&vUser?.sessionId!==localStorage.getItem('eduSessionId')){
                    showToast('تم فصل الجلسة لفتحها من جهاز آخر','error');
                    setTimeout(()=>logout(false),2000);return;
                }
                currentUser=vUser;refreshDashboard();
            }else{logout(false);}
        }
    }catch(e){console.error('DB sync error:',e);}
});

function saveDB(){database.ref('/').set(db).catch(()=>showToast('حدث خلل بالاتصال','error'));}

/* ── Share Links ── */
function copyShareLink(type,value,btn){
    const url=`${location.origin}${location.pathname}?view_${type}=${encodeURIComponent(value)}`;
    navigator.clipboard.writeText(url).then(()=>{
        showToast('تم نسخ الرابط','success');
        if(!btn)return;
        const orig=btn.innerHTML;
        btn.innerHTML='<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> تم النسخ';
        btn.classList.add('btn-success');btn.classList.remove('btn-outline');
        setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('btn-success');btn.classList.add('btn-outline');},2000);
    }).catch(()=>showToast('عطل فني منع النسخ','error'));
}

function copyCredentials(u,p,btn){
    navigator.clipboard.writeText(`معرف الدخول: ${u}\nكلمة المرور: ${p}`).then(()=>{
        showToast('تم نسخ هوية الوصول');
        if(!btn)return;
        const orig=btn.innerHTML;
        btn.innerHTML='<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        btn.classList.add('btn-success');
        setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('btn-success');},2000);
    });
}

/* ── Session ── */
function checkSession(){
    let saved=null,hasLink=false;
    try{
        saved=sessionStorage.getItem('eduPlatformActiveSession')||localStorage.getItem('eduPlatformSession');
        const p=new URLSearchParams(location.search);
        hasLink=p.has('view_content')||p.has('view_folder');
    }catch(e){}
    if(saved){
        try{
            const sUser=JSON.parse(saved);
            const vUser=db.users.find(u=>u?.username===sUser?.username&&u?.password===sUser?.password);
            if(vUser){currentUser=vUser;initDashboard();return;}
        }catch(e){}
    }
    if(hasLink){isGuestMode=true;currentUser={username:'زائر',role:'guest',isStar:false};initDashboard();return;}
    document.getElementById('login-section').classList.remove('hidden');
    try{
        const rem=localStorage.getItem('eduRememberMe');
        if(rem){const d=JSON.parse(rem);document.getElementById('login-username').value=d?.username||'';document.getElementById('login-password').value=d?.password||'';document.getElementById('remember-me').checked=true;}
    }catch(e){}
}

function login(){
    if(!db.users.length)return;
    const u=document.getElementById('login-username').value.trim();
    const p=document.getElementById('login-password').value.trim();
    if(db.pendingUsers.find(x=>x?.username===u&&x?.password===p))return showToast('حسابك قيد المراجعة الإدارية','warning');
    const user=db.users.find(x=>x?.username===u&&x?.password===p);
    if(!user)return showToast('بيانات الدخول غير صحيحة','error');
    const sid=Date.now().toString(36)+Math.random().toString(36).substr(2);
    user.sessionId=sid;
    try{
        localStorage.setItem('eduPlatformSession',JSON.stringify(user));
        localStorage.setItem('eduSessionId',sid);
        if(document.getElementById('remember-me').checked)localStorage.setItem('eduRememberMe',JSON.stringify({username:u,password:p}));
        else localStorage.removeItem('eduRememberMe');
    }catch(e){}
    const idx=db.users.findIndex(x=>x?.username===user?.username);
    if(idx>-1){db.users[idx].sessionId=sid;saveDB();}
    currentUser=user;isGuestMode=false;initDashboard();
}

function logout(c=true){
    try{localStorage.removeItem('eduPlatformSession');sessionStorage.removeItem('eduPlatformActiveSession');if(c)localStorage.removeItem('eduSessionId');}catch(e){}
    location.href=location.pathname;
}

function showRegisterForm(){document.getElementById('login-section').classList.add('hidden');document.getElementById('register-section').classList.remove('hidden');}
function showLoginForm(){document.getElementById('register-section').classList.add('hidden');document.getElementById('login-section').classList.remove('hidden');}

function submitRegistration(){
    const u=escapeHTML(document.getElementById('reg-username').value.trim());
    const p=document.getElementById('reg-password').value.trim();
    const c=escapeHTML(document.getElementById('reg-class').value.trim());
    if(!u||!p||!c)return showToast('يرجى استكمال كافة الخانات','error');
    if(db.users.find(x=>x?.username===u)||db.pendingUsers.find(x=>x?.username===u))return showToast('المعرّف مستخدم مسبقاً','error');
    db.pendingUsers.push({username:u,password:p,class:c,role:'student',isStar:false});
    saveDB();
    ['reg-username','reg-password','reg-class'].forEach(id=>document.getElementById(id).value='');
    showToast('تم إرسال الطلب للموافقة');showLoginForm();
}

/* ── Pending Users ── */
function renderPendingUsers(){
    const list=document.getElementById('admin-pending-list');list.innerHTML='';
    updatePendingBadge();

function rejectUser(u){if(confirm('هل أنت متأكد من قرار الرفض؟')){db.pendingUsers=db.pendingUsers.filter(x=>x?.username!==u);saveDB();showToast('تم رفض الحساب');renderPendingUsers();}}

/* ── Init Dashboard ── */
function initDashboard(){
    ['login-section','register-section'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    document.getElementById('main-header').classList.remove('hidden');

    if(isGuestMode){
        document.getElementById('welcome-msg').innerText='زائر';
        document.getElementById('welcome-msg').style.display='flex';
        document.getElementById('logout-btn').innerHTML='<svg class="icon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg> دخول';
        document.getElementById('sidebar-toggle').classList.remove('hidden');
        document.getElementById('student-sidebar').style.display='flex';
        document.querySelector('.sidebar-search-box').style.display='none';
        if(isMobile()){document.getElementById('mobile-student-nav').classList.remove('hidden');}
        showUserDashboard();return;
    }

    document.getElementById('welcome-msg').innerText=escapeHTML(currentUser?.username);
    document.getElementById('welcome-msg').style.display='flex';
    document.getElementById('logout-btn').innerHTML='<svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> خروج';

    if(currentUser?.role==='admin'){
        document.getElementById('install-pwa-btn').classList.add('hidden');
        if(localStorage.getItem('adminPreviewMode_'+currentUser?.username)==='true')showPreview(true);
        else{
            document.getElementById('admin-section').classList.remove('hidden');
            document.getElementById('preview-btn').classList.remove('hidden');
            if(isMobile()){
                document.getElementById('mobile-admin-nav').classList.remove('hidden');
                document.getElementById('mobile-fab-add').classList.remove('hidden');
            }
            refreshDashboard();
        }
    }else{
        document.getElementById('sidebar-toggle').classList.remove('hidden');
        document.getElementById('student-sidebar').style.display='flex';
        if(isMobile()){document.getElementById('mobile-student-nav').classList.remove('hidden');}
        showUserDashboard();
    }
}

function refreshDashboard(){
    if(currentUser?.role==='admin'&&!isPreviewMode){
        renderAdminFolders();updateFolderDropdowns();filterAdminContent();filterAdminUsers();updateClassesDropdown();renderPendingUsers();
        const lastTab=localStorage.getItem('lastActiveAdminTab_'+currentUser?.username)||'tab-content-add';
        openTab(null,lastTab);
        if(isMobile())syncMobAdminNav(lastTab);
    }else{showUserDashboard();}
}

function openTab(e,id){
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    const el=document.getElementById(id);if(el)el.classList.add('active');
    if(e)e.currentTarget.classList.add('active');
    else{const b=document.querySelector(`[onclick*="${id}"]`);if(b)b.classList.add('active');}
    if(currentUser?.role==='admin')localStorage.setItem('lastActiveAdminTab_'+currentUser?.username,id);
}

function toggleSidebar(){document.getElementById('student-sidebar').classList.toggle('collapsed');}

/* ── Fullscreen ── */
window.toggleCSSFullScreen=id=>{const w=document.getElementById(id);if(w){w.classList.add('css-fullscreen');document.body.style.overflow='hidden';}};
window.exitCSSFullScreen=id=>{const w=document.getElementById(id);if(w){w.classList.remove('css-fullscreen');document.body.style.overflow='';}};

/* ── Dropdowns ── */
function updateClassesDropdown(){
    const s=document.getElementById('content-classes');if(!s)return;
    const v=s.value;
    s.innerHTML=`<option value="admin">مسودة للإدارة</option><option value="all">متاح للكل</option>`;
    const set=new Set();
    db.users.forEach(u=>{if(u?.role==='student'&&u?.class)set.add(escapeHTML(u.class));});
    db.contents.forEach(c=>{if(c?.classes)c.classes.forEach(x=>{if(x!=='admin_only')set.add(escapeHTML(x));});});
    set.forEach(x=>s.innerHTML+=`<option value="${x}">${x}</option>`);
    if(v&&[...s.options].some(o=>o.value===v))s.value=v;
}

function updateFolderDropdowns(){
    const s=document.getElementById('content-folder');
    s.innerHTML='<option value="none">مستقل</option>';
    db.folders.forEach(f=>s.innerHTML+=`<option value="${f}">${f}</option>`);
}

/* ── Folders ── */
function addFolder(){
    const f=escapeHTML(document.getElementById('new-folder-name').value.trim());
    if(!f||db.folders.includes(f))return showToast('هذا التنظيم موجود مسبقاً!','error');
    db.folders.push(f);saveDB();document.getElementById('new-folder-name').value='';
    renderAdminFolders();updateFolderDropdowns();showToast('تمت إضافة المجلد بنجاح.');
}
function editFolder(old){
    const n=prompt("الاسم الجديد:",old);if(!n||!n.trim()||n===old)return;
    const t=escapeHTML(n.trim());if(db.folders.includes(t))return showToast('الاسم الجديد محجوز لمجلد آخر.','error');
    db.folders[db.folders.indexOf(old)]=t;
    db.contents.forEach(c=>{if(c?.folder===old)c.folder=t;});
    saveDB();renderAdminFolders();updateFolderDropdowns();filterAdminContent();showToast('تم تحديث اسم المجلد.');
}
function deleteFolder(f){
    if(!confirm("متابعة الحذف؟"))return;
    db.folders=db.folders.filter(x=>x!==f);
    db.contents.forEach(c=>{if(c?.folder===f)c.folder='none';});
    saveDB();renderAdminFolders();updateFolderDropdowns();filterAdminContent();showToast('تم الحذف وفك ارتباط الدروس.');
}

function renderAdminFolders(){
    const l=document.getElementById('admin-folders-list');l.innerHTML='';
    if(!db.folders.length)return l.innerHTML='<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>لا توجد تصنيفات حالياً.</div>';

    });

/* ── Content CRUD ── */
function saveContent(){
    const t=escapeHTML(document.getElementById('content-title').value.trim());
    const ty=document.getElementById('content-type').value;
    const f=document.getElementById('content-folder').value;
    const d=document.getElementById('content-data').value.trim();
    const c=document.getElementById('content-classes').value;
    const r=document.getElementById('content-ratio').value;
    const arr=c==='admin'?['admin_only']:(c==='all'?[]:[c]);
    if(!t||!d)return showToast('يرجى ملء عنوان الدرس وإضافة المحتوى','error');
    if(currentEditContentId){
        db.contents[db.contents.findIndex(x=>x?.id===currentEditContentId)]={id:currentEditContentId,title:t,type:ty,data:d,classes:arr,folder:f,ratio:r};
        cancelEditContent();showToast('تم تحديث المحتوى!');
    }else{
        db.contents.push({id:Date.now(),title:t,type:ty,data:d,classes:arr,folder:f,ratio:r});
        document.getElementById('content-title').value='';document.getElementById('content-data').value='';
        showToast('رائع! تم النشر');
    }
    saveDB();filterAdminContent();
}

    const term=document.getElementById('admin-search-content').value.toLowerCase();
    const list=document.getElementById('admin-content-list');list.innerHTML='';
    const res=db.contents.filter(i=>i?.title?.toLowerCase().includes(term)||(i?.folder||'').toLowerCase().includes(term));

    [...res].reverse().forEach(i=>{
        list.innerHTML+=`<div class="admin-list-item"><div><h4 style="font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;"><input type="checkbox" class="content-checkbox" value="${i?.id}"><svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> ${i?.title}</h4><div class="admin-item-meta" style="margin-top:6px;"><span>${i?.folder==='none'?'مستقل':i?.folder}</span></div></div><div class="admin-item-actions"><button onclick="copyShareLink('content','${i?.id}',this)" class="btn-icon-only" title="رابط الدرس فقط"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></button><button onclick="editContent(${i?.id})" class="btn-icon-only" style="color:var(--warning);" title="تعديل"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button><button onclick="deleteContent(${i?.id})" class="btn-icon-only" style="color:var(--danger);" title="حذف"><svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button></div></div>`;
    });

function deleteContent(id){if(confirm('هل تعي أن الإجراء يمحو الدرس بالكامل؟')){db.contents=db.contents.filter(c=>c?.id!==id);saveDB();filterAdminContent();showToast('تم الحذف');}}
function toggleAllContent(src){document.querySelectorAll('.content-checkbox').forEach(cb=>cb.checked=src?.checked);}
function deleteSelectedContent(){
    const sel=Array.from(document.querySelectorAll('.content-checkbox:checked')).map(cb=>parseInt(cb.value));
    if(!sel.length)return showToast('أشر أولاً.','warning');
    if(confirm('إزالة الجملة من النظام؟')){db.contents=db.contents.filter(c=>!sel.includes(c?.id));saveDB();filterAdminContent();showToast('تم التنظيف الجماعي');}
}
function editContent(id){
    const i=db.contents.find(c=>c?.id===id);if(!i)return;
    document.getElementById('content-title').value=i.title;
    document.getElementById('content-type').value=i.type;
    document.getElementById('content-folder').value=i.folder||'none';
    document.getElementById('content-data').value=i.data;
    document.getElementById('content-classes').value=(i.classes&&i.classes.includes('admin_only'))?'admin':(!i.classes.length?'all':i.classes[0]);
    currentEditContentId=id;
    document.getElementById('save-content-btn').innerHTML='<svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> تطبيق التعديل';

function cancelEditContent(){
    currentEditContentId=null;
    document.getElementById('content-title').value='';document.getElementById('content-data').value='';
    document.getElementById('save-content-btn').innerHTML='<svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> حفظ المادة';
    document.getElementById('cancel-edit-btn').classList.add('hidden');
}

/* ── Users CRUD ── */
function generatePassword(){document.getElementById('new-user-pass').value=Math.random().toString(36).slice(-6)+Math.floor(Math.random()*99);}
function saveUser(){
    const u=escapeHTML(document.getElementById('new-user-name').value.trim());
    const p=document.getElementById('new-user-pass').value.trim();
    const c=escapeHTML(document.getElementById('new-user-class').value.trim());
    const s=document.getElementById('new-user-star').checked;
    if(!u||!p)return showToast('مؤشرات الوصول ناقصة','error');
    if(currentEditUserOldName){
        if(u!==currentEditUserOldName&&db.users.find(x=>x?.username===u))return showToast('اسم الهوية مُحتكر مسبقاً','error');
        db.users[db.users.findIndex(x=>x?.username===currentEditUserOldName)]={username:u,password:p,role:'student',class:c,isStar:s};
        cancelEditUser();showToast('تم التعديل بنجاح');
    }else{
        if(db.users.find(x=>x?.username===u))return showToast('المشترك له قيود حالية','error');
        db.users.push({username:u,password:p,role:'student',class:c,isStar:s});
        ['new-user-name','new-user-pass','new-user-class'].forEach(id=>document.getElementById(id).value='');
        showToast('شمل الطالب بالمظلة التامة');
    }
    saveDB();filterAdminUsers();

function updateAdminCredentials(){
    const u=escapeHTML(document.getElementById('admin-new-user').value.trim());

    if(!u||!p)return showToast('معطيات غير كافية!','warning');

function exportDB(){
    const a=document.createElement('a');
    a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db));
    a.download='DB_Platform.json';document.body.appendChild(a);a.click();a.remove();

function importDB(){
    const f=document.getElementById('import-file');if(!f.files.length)return;
    if(!confirm('إجراء سيادي سيمسح القاعدة. هل أنت واثق؟'))return;
    const r=new FileReader();
    r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.users){db=d;saveDB();refreshDashboard();showToast('تمت استعادة المنصة بالكامل!');}}catch(err){showToast('الملف غير صالح','error');}};
    r.readAsText(f.files[0]);
}

function showPreview(init=false){

    document.getElementById('admin-section').classList.add('hidden');
    document.getElementById('preview-btn').classList.add('hidden');
    document.getElementById('back-admin-btn').classList.remove('hidden');
    document.getElementById('sidebar-toggle').classList.remove('hidden');
    document.getElementById('student-sidebar').style.display='flex';
    document.getElementById('student-sidebar').classList.remove('collapsed');
    if(isMobile()){
        document.getElementById('mobile-admin-nav').classList.add('hidden');
        document.getElementById('mobile-fab-add').classList.add('hidden');
        document.getElementById('mobile-student-nav').classList.remove('hidden');

}
function backToAdmin(){
    isPreviewMode=false;
    if(currentUser)localStorage.setItem('adminPreviewMode_'+currentUser?.username,'false');
    document.getElementById('user-section').classList.add('hidden');
    document.getElementById('admin-section').classList.remove('hidden');
    document.getElementById('preview-btn').classList.remove('hidden');
    document.getElementById('back-admin-btn').classList.add('hidden');
    document.getElementById('sidebar-toggle').classList.add('hidden');
    if(isMobile()){
        document.getElementById('mobile-student-nav').classList.add('hidden');
        document.getElementById('mobile-admin-nav').classList.remove('hidden');
        document.getElementById('mobile-fab-add').classList.remove('hidden');
    }
    refreshDashboard();showToast('تم العودة لوحدة الإدارة.');
}

/* ── Content Visibility ── */
function canViewContent(i){
    if(isGuestMode)return true;
    if(!i?.classes)return true;
    if(i.classes.includes('admin_only'))return currentUser?.role==='admin'&&!isPreviewMode;
    if(!i.classes.length||(currentUser?.role==='admin'&&!isPreviewMode)||currentUser?.isStar)return true;
    return i.classes.includes(currentUser?.class);
}

/* ── Sidebar Filtering ── */
function filterSidebar(){
    try{
        const t=document.getElementById('student-search-input').value.toLowerCase();
        document.querySelectorAll('#sidebar-content-list details').forEach(d=>{
            let v=false;
            d.querySelectorAll('li').forEach(l=>{if(l.innerText.toLowerCase().includes(t)){l.style.display='flex';v=true;}else l.style.display='none';});
            if(v){d.style.display='block';if(t)d.open=true;}else d.style.display='none';
        });
        document.querySelectorAll('#sidebar-content-list .independent-item').forEach(i=>{
            i.style.display=i.innerText.toLowerCase().includes(t)?'flex':'none';
        });
    }catch(e){}
}

function searchAllContent(){
    const t=document.getElementById('student-search-input').value.toLowerCase();
    let res=db.contents.filter(canViewContent);
    if(t)res=res.filter(i=>i?.title?.toLowerCase().includes(t));
    renderContentItems(res.reverse());
    document.querySelectorAll('.sidebar-item,.independent-item').forEach(e=>e.classList.remove('active'));
}

/* ── User Dashboard ── */
function showUserDashboard(){
    try{
        document.getElementById('user-section').classList.remove('hidden');
        let vC=null,vF=null;
        try{const p=new URLSearchParams(location.search);vC=p.get('view_content');vF=p.get('view_folder');}catch(e){}

        let res=db.contents.filter(canViewContent);

        /* ────────────────────────────────────────────────────
           FIX: view_content → يعرض هذا الدرس فقط (ليس المجلد)
                view_folder  → يعرض كل دروس المجلد
           ──────────────────────────────────────────────────── */
        if(isGuestMode){
            if(vF)res=res.filter(c=>c?.folder===vF);
            else if(vC){const s=res.find(c=>c?.id==vC);res=s?[s]:[];}
        }

        const sb=document.getElementById('sidebar-content-list');sb.innerHTML='';
        let grp={},ind=[];
        res.forEach(i=>{
            if(i?.folder&&i.folder!=='none'){if(!grp[i.folder])grp[i.folder]=[];grp[i.folder].push(i);}
            else ind.push(i);
        });

        let h='';
        for(let f in grp){
            h+=`<details ${isGuestMode?'open':''} class="premium-accordion">
                <summary>
                    <div class="summary-content">
                        <svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <span>${f}</span>
                    </div>
                    <div class="summary-actions">
                        <button onclick="event.stopPropagation();event.preventDefault();copyShareLink('folder','${f}',this);" class="btn-outline btn-copy-folder" title="نسخ رابط كامل القائمة">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg> القائمة
                        </button>
                        <svg class="icon arrow-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </summary>
                <ul>`;
            grp[f].forEach(i=>{h+=`<li class="sidebar-item" onclick="showSingleContent(${i?.id},this)"><svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;opacity:.7;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> ${i?.title}</li>`;});
            h+=`</ul></details>`;
        }
        ind.forEach(i=>{h+=`<div class="independent-item" onclick="showSingleContent(${i?.id},this)"><svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> ${i?.title}</div>`;});
        sb.innerHTML=h||'<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> الفهرس فارغ</div>';

        /* Close other accordions when one opens */
        const allDetails=sb.querySelectorAll('details.premium-accordion');
        allDetails.forEach(detail=>{
            detail.addEventListener('toggle',()=>{
                if(detail.open)allDetails.forEach(other=>{if(other!==detail&&other.open)other.open=false;});
            });
        });

        const sid=localStorage.getItem('lastViewedContentId_'+(currentUser?.username||'g'));
        const load=vC?res.find(c=>c?.id==vC):(sid&&!isGuestMode?res.find(c=>c?.id==sid):null);

        if(load){
            setTimeout(()=>{
                let el=null;
                document.querySelectorAll('.sidebar-item,.independent-item').forEach(e=>{if(e.getAttribute('onclick')?.includes(load.id))el=e;});
                showSingleContent(load.id,el);
                if(el?.closest('details'))el.closest('details').open=true;
            },50);
        }else if(vF){
            setTimeout(()=>{
                renderContentItems(res.filter(c=>c?.folder===vF).reverse());
                document.querySelectorAll('.sidebar summary').forEach(s=>{if(s.innerText.includes(vF))s.closest('details').open=true;});
            },50);
        }else{
            document.getElementById('content-display').innerHTML='<div class="empty-state" style="padding:80px 20px;"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>الردهة جاهزة. اختر محتوى من الفهرس.</div>';
        }
    }catch(e){console.error('Dashboard error:',e);}
}

function setActiveSidebarItem(el){document.querySelectorAll('.sidebar-item,.independent-item').forEach(e=>e.classList.remove('active'));if(el)el.classList.add('active');}

function showSingleContent(id,el){
    if(el)setActiveSidebarItem(el);
    if(isMobile())closeMobileDrawer(); /* إغلاق الدرور تلقائياً على الهاتف */
    const i=db.contents.find(c=>c?.id===id);
    if(i){
        renderContentItems([i]);
        if(currentUser&&!isGuestMode)localStorage.setItem('lastViewedContentId_'+currentUser.username,id);
    }
}

/* ── Render Content Items ── */
function renderContentItems(arr){
    try{
        const d=document.getElementById('content-display');d.innerHTML='';
        if(!arr.length)return d.innerHTML='<div class="empty-state"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>لا يوجد محتوى.</div>';

        arr.forEach(i=>{
            const div=document.createElement('div');div.className='content-item academic-text';

            /* ── زر رابط الدرس (هذا الدرس فقط) ── */
            const copyBtn=`<button type="button" onclick="copyShareLink('content',${i?.id},this)" class="btn-outline" style="padding:8px 14px;font-size:13px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;" title="رابط هذا الدرس فقط"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg> رابط الدرس</button>`;

            /* ── زر نسخ القائمة (يظهر فقط إذا كان الدرس داخل مجلد) ── */
            const folderBtn=(i?.folder&&i.folder!=='none')
                ?`<button type="button" onclick="copyShareLink('folder','${i?.folder}',this)" class="btn-secondary" style="padding:8px 14px;font-size:13px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;" title="رابط يعرض كل دروس القائمة"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> نسخ القائمة</button>`
                :'';

            let html='';
            if(i?.type==='html'){
                const wid=`w-${i?.id}`;
                let safe=i.data
                    .replace(/user-scalable=[a-z0-9]+/gi,'user-scalable=yes')
                    .replace(/maximum-scale=[0-9.]+/gi,'maximum-scale=5.0');
                const injectMeta=`<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes"><style>html,body{margin:0!important;padding:0!important;width:100%!important;min-height:100vh!important;touch-action:pan-x pan-y pinch-zoom!important;}iframe{width:100%!important;height:100vh!important;border:none!important;}</style>`;
                if(!safe.includes('touch-action'))
                    safe=safe.includes('</head>')?safe.replace(/<\/head>/i,injectMeta+'</head>'):injectMeta+safe;
                safe=safe.replace(/"/g,'&quot;');
                html=`
                <div class="content-header">
                    <h3 class="content-title">
                        <svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                        ${i?.title}
                    </h3>
                    <div class="header-actions">
                        ${copyBtn}
                        ${folderBtn}
                        <button onclick="toggleCSSFullScreen('${wid}')" class="btn-secondary" style="padding:8px 14px;font-size:13px;border-radius:20px;white-space:nowrap;">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg> ملء الشاشة
                        </button>
                    </div>
                </div>
                <div id="${wid}" class="iframe-responsive-wrapper">
                    <div class="fullscreen-top-bar">
                        <button class="fullscreen-close-btn" onclick="exitCSSFullScreen('${wid}')">
                            إغلاق الشاشة الكاملة
                            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    <iframe class="html-sandbox" srcdoc="${safe}" allowfullscreen loading="lazy"></iframe>
                </div>`;
            }else{
                html=`
                <div class="content-header">
                    <h3 class="content-title">
                        <svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        ${i?.title}
                    </h3>
                    <div class="header-actions">${copyBtn}${folderBtn}</div>
                </div>
                <a href="${i?.data}" target="_blank" rel="noopener noreferrer" style="display:flex;justify-content:center;align-items:center;gap:15px;background:var(--primary-gradient);color:white;padding:25px;text-decoration:none;border-radius:var(--radius-lg);margin-top:20px;font-weight:800;font-size:18px;box-shadow:var(--shadow-md);transition:.4s;">
                    <svg class="icon" style="width:26px;height:26px;" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    الانتقال للمقرر الخارجي
                </a>`;
            }
            div.innerHTML=html;d.appendChild(div);
        });
    }catch(e){console.error('Render error:',e);showToast('فشل عرض المحتوى','error');}
}

/* ══════════════════════════════════════════════
   MOBILE FUNCTIONS — وظائف الهاتف
   ══════════════════════════════════════════════ */

/* Admin bottom nav tab switch */
function mobAdminTab(id,btn){
    openTab(null,id);
    /* Update nav active state */
    if(btn){
        document.querySelectorAll('#mobile-admin-nav .mob-nav-btn').forEach(b=>b.classList.remove('mob-active'));
        btn.classList.add('mob-active');
    }
    /* FAB: show only on "جديد" tab */
    const fab=document.getElementById('mobile-fab-add');
    if(fab)fab.classList[id==='tab-content-add'?'remove':'add']('hidden');
    /* Update pending badge */
    updatePendingBadge();
    /* Render pending if switched there */
    if(id==='tab-pending-users')renderPendingUsers();
    window.scrollTo(0,0);
}

/* Sync mobile admin nav with current tab */
function syncMobAdminNav(tabId){
    const map={
        'tab-content-add':0,'tab-content-manage':1,'tab-menus':2,
        'tab-users-add':3,'tab-users-manage':3,'tab-pending-users':3,'tab-settings':4
    };
    const idx=map[tabId];
    if(idx===undefined)return;
    const btns=document.querySelectorAll('#mobile-admin-nav .mob-nav-btn');
    btns.forEach((b,i)=>b.classList.toggle('mob-active',i===idx));
    const fab=document.getElementById('mobile-fab-add');
    if(fab)fab.classList[tabId==='tab-content-add'?'remove':'add']('hidden');
}

/* Pending badge */
function updatePendingBadge(){
    const badge=document.getElementById('mob-pending-badge');if(!badge)return;
    const count=db.pendingUsers.length;
    if(count>0){badge.textContent=count;badge.classList.remove('hidden');}
    else badge.classList.add('hidden');
}

/* ── Drawer (student sidebar) ── */
function openMobileDrawer(){
    document.getElementById('student-sidebar').classList.add('mobile-open');
    document.getElementById('mobile-drawer-overlay').classList.add('visible');
}
function closeMobileDrawer(){
    document.getElementById('student-sidebar').classList.remove('mobile-open');
    document.getElementById('mobile-drawer-overlay').classList.remove('visible');
}
function mobToggleDrawer(btn){
    const isOpen=document.getElementById('student-sidebar').classList.contains('mobile-open');
    if(isOpen){
        closeMobileDrawer();
        /* Restore home button active */
        document.querySelectorAll('#mobile-student-nav .mob-nav-btn').forEach(b=>b.classList.remove('mob-active'));
        const hb=document.getElementById('mob-home-btn');if(hb)hb.classList.add('mob-active');
    }else{
        openMobileDrawer();
        document.querySelectorAll('#mobile-student-nav .mob-nav-btn').forEach(b=>b.classList.remove('mob-active'));
        if(btn)btn.classList.add('mob-active');
    }
}

/* ── Student home ── */
function mobStudentHome(btn){
    closeMobileDrawer();closeMobileSearch();
    if(btn){document.querySelectorAll('#mobile-student-nav .mob-nav-btn').forEach(b=>b.classList.remove('mob-active'));btn.classList.add('mob-active');}
    const sid=localStorage.getItem('lastViewedContentId_'+(currentUser?.username||'g'));
    const res=db.contents.filter(canViewContent);
    const load=sid?res.find(c=>c?.id==sid):null;
    if(load)showSingleContent(load.id,null);
    else document.getElementById('content-display').innerHTML='<div class="empty-state" style="padding:80px 20px;"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>اختر درساً من الفهرس.</div>';
}

/* ── Mobile Search ── */
function openMobileSearch(btn){
    closeMobileDrawer();
    if(btn){document.querySelectorAll('#mobile-student-nav .mob-nav-btn').forEach(b=>b.classList.remove('mob-active'));btn.classList.add('mob-active');}
    document.getElementById('mobile-search-overlay').classList.add('visible');
    setTimeout(()=>document.getElementById('mob-search-input').focus(),100);
}
function closeMobileSearch(){
    document.getElementById('mobile-search-overlay').classList.remove('visible');
    /* Restore home active */
    document.querySelectorAll('#mobile-student-nav .mob-nav-btn').forEach(b=>b.classList.remove('mob-active'));
    const hb=document.getElementById('mob-home-btn');if(hb)hb.classList.add('mob-active');
}
function processMobSearch(){
    const t=document.getElementById('mob-search-input').value.toLowerCase();
    const res=db.contents.filter(canViewContent).filter(c=>!t||c?.title?.toLowerCase().includes(t));
    const div=document.getElementById('mob-search-results');
    if(!res.length){div.innerHTML='<div class="empty-state">لا نتائج مطابقة</div>';return;}
    div.innerHTML=res.map(i=>`
        <div class="admin-list-item" style="cursor:pointer;margin-bottom:10px;" onclick="selectMobResult(${i.id})">
            <div>
                <h4 style="font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;">
                    <svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
                    ${i.title}
                </h4>
                <div class="admin-item-meta" style="margin-top:4px;">${i.folder!=='none'?i.folder:'مستقل'}</div>
            </div>
            <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>`).join('');
}
function selectMobResult(id){
    closeMobileSearch();
    showSingleContent(id,null);
    document.querySelectorAll('#mobile-student-nav .mob-nav-btn').forEach(b=>b.classList.remove('mob-active'));
    const hb=document.getElementById('mob-home-btn');if(hb)hb.classList.add('mob-active');
}
</script>
